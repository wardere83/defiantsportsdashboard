<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Defiant Sports — World Cup 2026 Operations</title>
    <meta
      name="description"
      content="Defiant Sports operations intelligence for FIFA World Cup 2026: live fixtures, host-city stewardship, grants, transportation, safety, and cultural programming."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --ink: #0a0a0a;
        --ink-2: #3f3f46;
        --ink-3: #71717a;
        --ink-4: #a1a1aa;
        --line: #e4e4e7;
        --line-2: #d4d4d8;
        --black: #0a0a0a;
        --white: #ffffff;
        --live: #00a650;
        --live-glow: rgba(0, 166, 80, 0.18);
        --warn: #d97706;
        --accent: #1d4ed8;
        --rail: 232px;
        --topbar: 64px;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow-sm: 0 1px 2px rgba(10, 10, 10, 0.04);
        --shadow-md: 0 4px 16px rgba(10, 10, 10, 0.06);
        --shadow-lg: 0 14px 44px rgba(10, 10, 10, 0.10);
        --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      /* ─────────── Layout shell ─────────── */
      .app {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        height: 100vh;
        height: 100dvh;
      }

      .rail {
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--white);
        border-right: 1px solid var(--line);
        min-width: 0;
        overflow: hidden;
      }

      .brand {
        padding: 22px 20px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .brand img {
        width: 168px;
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }

      .nav {
        padding: 6px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .nav button {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 550;
        font-size: 12.5px;
        letter-spacing: -0.005em;
        transition: background .15s ease, color .15s ease, transform .15s ease;
      }
      .nav button:hover { background: var(--surface-2); color: var(--ink); }
      .nav button.active {
        background: var(--ink);
        color: var(--white);
        box-shadow: var(--shadow-sm);
      }
      .nav .glyph {
        display: grid;
        place-items: center;
        font-size: 13px;
        opacity: .8;
      }
      .nav button.active .glyph { opacity: 1; }
      .nav .kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-4);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .nav button.active .kbd {
        background: rgba(255,255,255,.10);
        border-color: rgba(255,255,255,.18);
        color: rgba(255,255,255,.9);
      }

      .rail-foot {
        border-top: 1px solid var(--line);
        padding: 12px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--ink-3);
      }
      .rail-foot a { font-weight: 600; color: var(--ink); }
      .rail-foot .ping {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ink-4);
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
      }
      .rail-foot .ping.live {
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--live-glow); }
        50% { box-shadow: 0 0 0 8px transparent; }
      }

      /* ─────────── Top bar ─────────── */
      .content {
        display: grid;
        grid-template-rows: var(--topbar) minmax(0, 1fr);
        min-width: 0;
        min-height: 0;
        background: var(--bg);
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,.72);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
      }
      .topbar h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .topbar .crumb {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }
      .top-actions { display: flex; align-items: center; gap: 8px; }

      .live-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        font-weight: 600;
        font-size: 11.5px;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow-sm);
      }
      .live-chip .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .live-chip.off { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }
      .live-chip.off .dot { background: var(--ink-4); animation: none; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
      }
      .btn:hover { background: var(--surface-2); }
      .btn:active { transform: translateY(1px); }
      .btn.dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
      .btn.dark:hover { background: #1a1a1a; }
      .btn.icon { width: 32px; padding: 0; }

      .select {
        height: 32px;
        padding: 0 28px 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%2371717a' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 9px center;
        font-size: 12px;
        appearance: none;
        -webkit-appearance: none;
      }

      /* ─────────── Main view ─────────── */
      .view {
        min-height: 0;
        min-width: 0;
        padding: 14px 18px 16px;
        overflow: hidden;
      }
      .section { display: none; height: 100%; min-height: 0; min-width: 0; }
      .section.active { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .section .fill { flex: 1 1 auto; min-height: 0; min-width: 0; }
      .section .fill > .card { height: 100%; }

      /* Overview = master grid that fits in one screen */
      #overview.section.active {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr);
        grid-template-areas:
          "kpi    kpi"
          "live   live"
          "map    rail";
        gap: 12px;
      }

      .grid-kpi { grid-area: kpi; }
      .grid-live { grid-area: live; }
      .grid-map { grid-area: map; min-height: 0; }
      .grid-rail { grid-area: rail; min-height: 0; }

      /* ─────────── Cards ─────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .card-head .meta {
        font-size: 11px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
      }
      .card-body {
        padding: 12px 14px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .card-body.flush { padding: 0; }

      /* KPI strip */
      .kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .kpi .label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kpi .value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
        font-feature-settings: "tnum" 1;
      }
      .kpi .sub {
        font-size: 11px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kpi .delta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 10.5px;
        color: var(--live);
        background: rgba(0,166,80,.08);
        padding: 2px 7px;
        border-radius: 999px;
      }
      .kpi.invert {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      .kpi.invert .label, .kpi.invert .sub { color: rgba(255,255,255,.65); }
      .kpi.invert .value { color: var(--white); }

      /* ─────────── LIVE FIFA section ─────────── */
      .live-card {
        background: var(--ink);
        color: var(--white);
        border: 1px solid var(--ink);
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
      }
      .live-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 200px at 0% 0%, rgba(0,166,80,.12), transparent 60%),
          radial-gradient(700px 220px at 100% 100%, rgba(29,78,216,.10), transparent 60%);
        pointer-events: none;
      }
      .live-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,.08);
        position: relative;
      }
      .live-head .title {
        display: flex; align-items: center; gap: 10px;
        font-weight: 700; letter-spacing: -0.01em; font-size: 13px;
      }
      .live-head .title .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--live);
        color: #fff;
        font-size: 10.5px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        padding: 3px 8px; border-radius: 999px;
      }
      .live-head .title .badge::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.6s ease-in-out infinite;
      }
      .live-head .meta {
        font-size: 11px;
        color: rgba(255,255,255,.6);
        font-family: var(--mono);
      }

      .ticker {
        position: relative;
        padding: 10px 0;
        overflow: hidden;
        mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
      }
      .ticker-track {
        display: inline-flex;
        gap: 28px;
        white-space: nowrap;
        animation: marquee 60s linear infinite;
        padding-left: 100%;
      }
      .ticker-track:hover { animation-play-state: paused; }
      .ticker-item {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 12.5px;
        color: rgba(255,255,255,.92);
      }
      .ticker-item .src {
        font-family: var(--mono);
        font-size: 10.5px;
        color: rgba(255,255,255,.55);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-left: 2px solid rgba(255,255,255,.18);
        padding-left: 10px;
      }
      .ticker-item .sep { color: rgba(255,255,255,.24); }
      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .live-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .live-cell {
        padding: 10px 14px;
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .live-cell:last-child { border-right: 0; }
      .live-cell .name {
        font-size: 11px;
        color: rgba(255,255,255,.55);
        font-weight: 600;
        letter-spacing: 0.04em;
        display: flex; align-items: center; gap: 6px;
      }
      .live-cell .name::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 8px var(--live-glow);
      }
      .live-cell.off .name::before { background: var(--ink-4); box-shadow: none; }
      .live-cell .v {
        font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em;
      }
      .live-cell .lat {
        font-family: var(--mono);
        font-size: 10.5px;
        color: rgba(255,255,255,.50);
      }

      /* Map */
      .map-wrap { flex: 1; min-height: 0; position: relative; }
      .map { position: absolute; inset: 0; background: #eef0f2; }
      .leaflet-container { font-family: var(--font); background: #eef0f2; }
      .leaflet-control-attribution { font-size: 9px; color: var(--ink-3); }
      .host-marker {
        display: block;
        width: 12px; height: 12px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--white);
        box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 1px 4px rgba(0,0,0,.25);
        transition: transform .15s ease;
      }
      .host-marker.active {
        width: 16px; height: 16px;
        background: var(--ink);
        box-shadow: 0 0 0 4px rgba(0,166,80,.22), 0 1px 6px rgba(0,0,0,.3);
      }

      .map-legend {
        position: absolute;
        left: 12px; bottom: 12px;
        background: rgba(255,255,255,.95);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 11px;
        color: var(--ink-2);
        display: flex; align-items: center; gap: 12px;
        box-shadow: var(--shadow-sm);
        z-index: 400;
      }
      .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .map-legend i {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--white); border: 2px solid var(--ink);
      }
      .map-legend i.sel { background: var(--ink); }

      /* Right rail in overview */
      .rail-stack {
        display: grid;
        gap: 10px;
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        min-height: 0;
      }
      .list { display: flex; flex-direction: column; gap: 0; }
      .list-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .list-row:last-child { border-bottom: 0; }
      .list-row .lbl { color: var(--ink-2); font-weight: 500; }
      .list-row .val { color: var(--ink); font-weight: 700; font-feature-settings: "tnum" 1; }

      .bar-row {
        display: grid;
        grid-template-columns: 88px 1fr 44px;
        gap: 10px;
        align-items: center;
        font-size: 11.5px;
        color: var(--ink-2);
        padding: 6px 0;
      }
      .bar-row .lbl { font-weight: 600; color: var(--ink); }
      .bar-row .val { text-align: right; font-weight: 700; font-family: var(--mono); font-size: 11px; color: var(--ink); }
      .track {
        height: 5px;
        background: var(--surface-2);
        border-radius: 999px;
        overflow: hidden;
      }
      .track span {
        display: block; width: var(--w);
        height: 100%; background: var(--ink);
        border-radius: 999px;
      }

      /* Tables */
      .table-wrap { overflow: auto; height: 100%; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      thead th {
        position: sticky; top: 0;
        background: var(--surface);
        font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-3);
        font-weight: 700;
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      tbody td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        color: var(--ink-2);
      }
      tbody tr:hover td { background: var(--surface-2); }
      tbody td strong { color: var(--ink); font-weight: 700; }

      /* Pills */
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 10.5px; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--ink-2);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
      }
      .pill.ok { color: #057a37; background: rgba(0,166,80,.10); border-color: rgba(0,166,80,.22); }
      .pill.warn { color: #92400e; background: rgba(217,119,6,.10); border-color: rgba(217,119,6,.22); }
      .pill.dot::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: currentColor;
      }

      /* Generic two-col / three-col grids for sub-views */
      .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

      .lede {
        font-size: 12.5px;
        color: var(--ink-2);
        margin: 0;
      }
      .lede strong { color: var(--ink); }

      /* Modal */
      .modal {
        position: fixed; inset: 0;
        background: rgba(10,10,10,.45);
        display: none; align-items: center; justify-content: center;
        z-index: 1000;
        padding: 18px;
        backdrop-filter: blur(2px);
      }
      .modal.open { display: flex; }
      .modal-card {
        width: min(560px, 100%);
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      /* Toast */
      .toast {
        position: fixed; bottom: 18px; left: 50%;
        transform: translate(-50%, 20px);
        background: var(--ink); color: var(--white);
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 12px; font-weight: 600;
        opacity: 0; pointer-events: none;
        transition: opacity .2s ease, transform .25s ease;
        z-index: 2000;
        box-shadow: var(--shadow-lg);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Mobile menu trigger */
      .menu-btn { display: none; }

      /* ─────────── Responsive ─────────── */
      @media (max-width: 1280px) {
        :root { --rail: 208px; }
        .kpi .value { font-size: 22px; }
      }

      @media (max-width: 1100px) {
        #overview.section.active {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(220px, 1fr) minmax(220px, auto);
          grid-template-areas:
            "kpi"
            "live"
            "map"
            "rail";
        }
        .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .live-cell:nth-child(2) { border-right: 0; }
      }

      @media (max-width: 980px) {
        body { overflow: auto; }
        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }
        .rail {
          position: sticky; top: 0; z-index: 20;
          grid-template-rows: auto auto auto;
          background: rgba(255,255,255,.92);
          backdrop-filter: blur(12px);
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand { padding: 14px 16px 8px; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
        .brand img { width: 132px; }
        .menu-btn {
          display: inline-flex;
          width: 36px; height: 36px;
          border-radius: 8px;
          border: 1px solid var(--line);
          background: var(--white);
          align-items: center; justify-content: center;
        }
        .nav {
          display: flex;
          flex-direction: row;
          overflow-x: auto;
          padding: 4px 12px 12px;
          gap: 6px;
          scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav button {
          display: inline-flex;
          width: auto;
          flex: 0 0 auto;
          grid-template-columns: none;
          padding: 8px 12px;
          gap: 8px;

        .nav .kbd { display: none; }
        .rail-foot { display: none; }
        .content { grid-template-rows: auto minmax(0, 1fr); }
        .topbar { padding: 12px 16px; height: auto; }
        .top-actions .select { display: none; }
        .view { padding: 12px 14px 18px; overflow: visible; }
        .section.active { display: block; }
        #overview.section.active {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "kpi" "live" "map" "rail";
          grid-template-rows: auto auto 320px auto;
        }
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-2, .grid-3 { grid-template-columns: 1fr; }
        .card-body { max-height: none; }
        .table-wrap { max-height: 60vh; }
      }

      @media (max-width: 560px) {
        .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
        .kpi .value { font-size: 20px; }
        .live-grid { grid-template-columns: 1fr 1fr; }
        .topbar h2 { font-size: 14px; }
      }

      /* Print */
      @media print {
        .rail, .topbar { display: none; }
        body { overflow: visible; }
        .app { display: block; height: auto; }
        .view { padding: 0; overflow: visible; }
      }

  <body>
    <div class="app">
      <aside class="rail" aria-label="Primary navigation">
        <div class="brand">

      <main class="content">
        <header class="topbar">
          <div>
            <h2 id="viewTitle">Operations Overview</h2>

              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              Refresh

        <div class="view">
          <section class="section" id="overview"></section>
          <section class="section" id="map"></section>
          <section class="section" id="live"></section>
          <section class="section" id="stadiums"></section>
          <section class="section" id="grants"></section>
          <section class="section" id="business"></section>
          <section class="section" id="transport"></section>
          <section class="section" id="safety"></section>
          <section class="section" id="marathon"></section>
          <section class="section" id="youth"></section>

          <section class="section" id="translate"></section>
          <section class="section" id="bracket"></section>
        </div>
      </main>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="card-head">
          <h3 id="modalTitle">Detail</h3>
          <button class="btn icon" id="closeModal" type="button" aria-label="Close">×</button>
        </div>
        <div class="card-body" id="modalBody"></div>

    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // ───────────────── Data ─────────────────
      const views = [
        ["overview",  "Overview",   "1", "▦"],
        ["live",      "Live FIFA",  "2", "◉"],
        ["map",       "Host Map",   "3", "◇"],
        ["stadiums",  "Stadiums",   "4", "⌂"],
        ["transport", "Transport",  "7", "⇄"],
        ["safety",    "Safety",     "8", "△"],
        ["youth",     "Youth",      "0", "○"],
        ["bracket",   "Bracket",    "[", "⌁"]
      ];

      const stadiums = [
        { city: "Atlanta", country: "USA", venue: "Atlanta Stadium", cap: 75000, role: "Group · R32 · R16 · Semi-final", lat: 33.755, lng: -84.401 },
        { city: "Boston", country: "USA", venue: "Boston Stadium", cap: 65000, role: "Group · R32 · Quarter-final", lat: 42.091, lng: -70.164 },
        { city: "Dallas", country: "USA", venue: "Dallas Stadium", cap: 94000, role: "Group · R32 · R16 · Semi-final", lat: 32.748, lng: -97.093 },
        { city: "Guadalajara", country: "Mexico", venue: "Estadio Guadalajara", cap: 48000, role: "Group stage", lat: 20.682, lng: -103.462 },
        { city: "Houston", country: "USA", venue: "Houston Stadium", cap: 72000, role: "Group · R32 · R16", lat: 29.684, lng: -95.411 },
        { city: "Kansas City", country: "USA", venue: "Kansas City Stadium", cap: 73000, role: "Group · R32 · Quarter-final", lat: 39.049, lng: -94.484 },
        { city: "Los Angeles", country: "USA", venue: "Los Angeles Stadium", cap: 70000, role: "Group · R32 · Quarter-final", lat: 33.953, lng: -118.339 },
        { city: "Mexico City", country: "Mexico", venue: "Estadio Azteca", cap: 83000, role: "Opening · Group · R32 · R16", lat: 19.303, lng: -99.151 },
        { city: "Miami", country: "USA", venue: "Miami Stadium", cap: 65000, role: "Group · R32 · QF · 3rd-place", lat: 25.958, lng: -80.239 },
        { city: "Monterrey", country: "Mexico", venue: "Estadio Monterrey", cap: 53500, role: "Group · R32", lat: 25.669, lng: -100.244 },
        { city: "New York/NJ", country: "USA", venue: "MetLife Stadium", cap: 82500, role: "Group · R32 · R16 · Final", lat: 40.813, lng: -74.874 },
        { city: "Philadelphia", country: "USA", venue: "Philadelphia Stadium", cap: 69000, role: "Group · R16", lat: 39.901, lng: -75.168 },
        { city: "SF Bay Area", country: "USA", venue: "Bay Area Stadium", cap: 71000, role: "Group · R32", lat: 37.403, lng: -121.970 },
        { city: "Seattle", country: "USA", venue: "Seattle Stadium", cap: 69000, role: "Group · R32 · R16", lat: 47.595, lng: -122.331 },
        { city: "Toronto", country: "Canada", venue: "BMO Field", cap: 45000, role: "Group · R32", lat: 43.633, lng: -79.418 },
        { city: "Vancouver", country: "Canada", venue: "BC Place", cap: 54000, role: "Group · R32 · R16", lat: 49.276, lng: -123.111 }
      ];

      const grants = [
        ["Seattle", "Small Sparks Fund", "Open", "Up to $5,000", "Rolling through Oct 30, 2026"],
        ["Los Angeles", "LA84 Foundation Cycle", "Ongoing", "Year-round small grants", "Verify portal timing"],
        ["Atlanta", "GA 100 mini-pitch", "Ongoing", "Up to $100,000 match", "RFP pathway"],
        ["U.S. host cities", "Safe Places to Play", "Ongoing", "Project-based", "Monitor pathway"]
      ];

      const countries = [
        ["Canada", "Host", "English, French"],
        ["Mexico", "Host", "Spanish"],
        ["United States", "Host", "English"],
        ["Argentina", "Spotlight", "Spanish"],
        ["Brazil", "Spotlight", "Portuguese"],
        ["Australia", "Spotlight", "English"],
        ["Belgium", "Spotlight", "Dutch · French · German"],
        ["Algeria", "Spotlight", "Arabic · French"],
        ["Cabo Verde", "Spotlight", "Portuguese · Creole"]
      ];

      const transitRows = [
        ["Seattle", "Sound Transit · stadium crowd-flow"],
        ["Los Angeles", "Metro-first stadium movement"],
        ["New York/NJ", "NJ TRANSIT · host committee mobility"],
        ["Philadelphia", "City event & safety guidance"],
        ["Dallas", "Mobility planning & shuttles"]
      ];

      const bracketRows = [
        ["Group stage", "12 groups of four", "Top two + 8 best 3rd-place", "Confirmed", "FIFA format"],
        ["Round of 32", "32 teams", "First knockout round", "Pending draw", "Source-driven"],
        ["Round of 16", "16 teams", "Knockout", "Pending", "No invented winners"],
        ["Quarter-finals", "8 teams", "Knockout", "Pending", "Official placement later"],
        ["Semi-finals", "4 teams", "Atlanta · Dallas", "Pending", "Venue role"],
        ["Final", "2 teams", "MetLife · NY/NJ", "Pending", "Venue role"]
      ];

      // ───────────────── State ─────────────────
      const state = {
        view: "overview",
        city: "New York/NJ",
        stadiumQuery: "",
        stadiumSort: { key: "cap", dir: "desc" },
        live: "syncing",
        grantLive: "syncing",
        liveSources: [],
        grantSources: [],
        liveItems: [],
        grantItems: [],
        generatedAt: null,
        grantGeneratedAt: null
      };
      const maps = {};
      const markerLayers = {};

      const $  = (s, r=document) => r.querySelector(s);
      const $$ = (s, r=document) => [...r.querySelectorAll(s)];

      // ───────────────── Helpers ─────────────────
      function escapeHtml(v) {
        return String(v ?? "")
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      function clean(v) { return String(v ?? "").replace(/\s+/g, " ").trim(); }
      function prettyStatus(s) {
        if (!s) return "—";
        return s;
      }

      // ───────────────── Nav ─────────────────
      function renderNav() {
        $("#nav").innerHTML = views.map(([id, label, key, glyph]) => `
          <button class="${state.view === id ? "active" : ""}" data-view="${id}" type="button">
            <span>${label}</span>
          </button>
        `).join("");
      }

      // ───────────────── KPIs ─────────────────
      function renderKpis() {
        const totalCap = stadiums.reduce((s, x) => s + x.cap, 0);
        // Impact = projected fan reach across the tournament (avg fill * 104 matches)
        const projectedReach = Math.round((totalCap / stadiums.length) * 0.95 * 104 / 1e6 * 10) / 10;
        const liveCount = state.liveSources.filter(s => s.status === "live" || s.status === "reachable").length;
        const liveTotal = state.liveSources.length || 4;
        return `
          <div class="kpis grid-kpi">
            <div class="kpi"><span class="label">Host Cities</span><span class="value" data-count="16">16</span><span class="sub">USA · CAN · MEX</span></div>
            <div class="kpi"><span class="label">Total Capacity</span><span class="value" data-count="${(totalCap/1e6).toFixed(2)}" data-suffix="M">${(totalCap/1e6).toFixed(2)}M</span><span class="sub"><span class="delta">+${stadiums.length} venues</span></span></div>
            <div class="kpi"><span class="label">Impact</span><span class="value" data-count="${projectedReach}" data-suffix="M+">${projectedReach}M+</span><span class="sub">Projected fan reach · 104 matches</span></div>
            <div class="kpi"><span class="label">Live Feeds</span><span class="value" data-count="${liveCount}">${liveCount}/${liveTotal}</span><span class="sub">${state.live === "connected" ? "Streaming" : state.live}</span></div>
            <div class="kpi invert"><span class="label">FIFA 2026</span><span class="value" data-count="48">48</span><span class="sub">Teams · 104 matches</span></div>
          </div>`;
      }

      // KPI count-up animation (runs after render)
      function animateCountUps(root = document) {
        root.querySelectorAll(".kpi .value[data-count]").forEach((el) => {
          if (el.dataset.animated === "1") return;
          el.dataset.animated = "1";
          const target = parseFloat(el.dataset.count);
          const suffix = el.dataset.suffix || "";
          if (!isFinite(target)) return;
          const orig = el.textContent;
          const duration = 700;
          const start = performance.now();
          const decimals = (String(target).split(".")[1] || "").length;
          function tick(now) {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const v = (target * eased).toFixed(decimals);
            el.textContent = (decimals > 0 ? v : Math.round(target * eased)) + suffix;
            if (t < 1) requestAnimationFrame(tick); else el.textContent = orig;
          }
          requestAnimationFrame(tick);
        });
      }

      // ───────────────── Live FIFA card ─────────────────
      function renderLiveCard() {
        const items = state.liveItems.length
          ? state.liveItems.slice(0, 12)
          : [
              { source: "FIFA", title: "Awaiting live source sync — refresh to query verified endpoints" },
              { source: "CDC",  title: "Travel notices feed standing by" },
              { source: "FIFA", title: "Tournament facts endpoint listed" },
              { source: "FIFA", title: "Teams endpoint listed" }
            ];
        const tickerHtml = items.concat(items).map(i => `
          <span class="ticker-item">
            <span class="src">${escapeHtml(i.source || "FEED")}</span>
            <span>${escapeHtml(clean(i.title))}</span>
          </span>
          <span class="sep">◆</span>
        `).join("");

        const sources = state.liveSources.length ? state.liveSources : [
          { name: "FIFA Fixtures",    status: "syncing", latencyMs: 0 },
          { name: "FIFA Teams",       status: "syncing", latencyMs: 0 },
          { name: "Tournament Facts", status: "syncing", latencyMs: 0 },
          { name: "CDC Travel",       status: "syncing", latencyMs: 0 }
        ];

        const cells = sources.slice(0, 4).map(s => {
          const isLive = s.status === "live" || s.status === "reachable";
          return `
            <div class="live-cell ${isLive ? "" : "off"}">
              <span class="name">${escapeHtml(s.name)}</span>
              <span class="v">${escapeHtml(prettyStatus(s.status))}</span>
              <span class="lat">${s.latencyMs ? s.latencyMs + " ms" : "—"}</span>
            </div>`;
        }).join("");

        const generated = state.generatedAt
          ? new Date(state.generatedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" })
          : "—";

        return `
          <div class="live-card grid-live">
            <div class="live-head">
              <div class="title">
                <span class="badge">LIVE</span>
                <span>FIFA World Cup 2026 — Source Stream</span>
              </div>
              <div class="meta">last sync · ${generated}</div>
            </div>
            <div class="ticker"><div class="ticker-track">${tickerHtml}</div></div>
            <div class="live-grid">${cells}</div>
          </div>`;
      }

      // ───────────────── Map card ─────────────────
      function renderMapCard(idSuffix) {
        const focus = stadiums.find(s => s.city === state.city) || stadiums[0];
        const mapId = `hostMap_${idSuffix}`;
        return `
          <div class="card grid-map">
            <div class="card-head">
              <h3>Host-city Map</h3>
              <span class="meta">${focus.city} · ${focus.venue} · ${focus.cap.toLocaleString()}</span>
            </div>
            <div class="map-wrap">
              <div class="map" id="${mapId}"></div>
              <div class="map-legend">
                <span><i></i>Host city</span>
                <span><i class="sel"></i>Selected</span>
              </div>
            </div>
          </div>`;
      }

      // ───────────────── Right rail ─────────────────
      function renderRightRail() {
        const top = stadiums.slice().sort((a, b) => b.cap - a.cap).slice(0, 5);
        const partners = [
          ["The Defiant Foundation", "Program design"],
          ["Bulle Consulting", "Fund development"],
          ["DreamCo Management", "Marketing strategy"]
        ];
        return `
          <div class="rail-stack grid-rail">
            <div class="card">
              <div class="card-head"><h3>Top Stadium Capacity</h3><span class="meta">Verified venues</span></div>
              <div class="card-body">
                ${top.map(s => bar(s.city, s.cap, 94000)).join("")}
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Scale Partners</h3><span class="meta">Defiant Sports network</span></div>
              <div class="card-body">
                <div class="list">
                  ${partners.map(([k, v]) => listRow(k, `<span class="pill">${v}</span>`)).join("")}
                  ${listRow("Open grants", `<span class="pill ok dot">${grants.length} active</span>`)}
                  ${listRow("Languages", `<span class="pill">${countries.length}+ supported</span>`)}
                </div>
              </div>
            </div>
          </div>`;
      }

      function bar(label, value, max) {
        const w = Math.max(8, Math.round((value / max) * 100));
        return `
          <div class="bar-row">
            <span class="lbl">${label}</span>
            <div class="track"><span style="--w:${w}%"></span></div>
            <span class="val">${(value/1000).toFixed(0)}k</span>
          </div>`;
      }

      function listRow(label, value) {
        return `<div class="list-row"><span class="lbl">${label}</span><span class="val">${value}</span></div>`;
      }

      // ───────────────── Section renderers ─────────────────
      function renderOverview() {
        $("#overview").innerHTML = `
          ${renderKpis()}
          ${renderLiveCard()}
          ${renderMapCard("overview")}
          ${renderRightRail()}
        `;
      }

      function renderLiveSection() {
        const items = state.liveItems;
        const sources = state.liveSources;

        const sourceList = sources.length
          ? sources.map(s => `
            <div class="list-row">
              <span class="lbl"><strong>${escapeHtml(s.name)}</strong><br /><span style="color:var(--ink-3); font-size:11px">${escapeHtml(s.category || "Live source")}</span></span>
              <span class="val"><span class="pill ${s.status === "live" || s.status === "reachable" ? "ok" : "warn"} dot">${escapeHtml(prettyStatus(s.status))} · ${s.latencyMs || 0}ms</span></span>
            </div>`).join("")
          : `<div class="lede" style="padding:6px 0">Click <strong>Refresh</strong> to query verified FIFA, CDC, and host-city endpoints in real time. The dashboard never invents live data.</div>`;

        const itemTable = items.length
          ? `<table>
              <thead><tr><th>Source</th><th>Headline</th><th>Published</th></tr></thead>
              <tbody>
                ${items.slice(0, 30).map(i => `
                  <tr>
                    <td><span class="pill">${escapeHtml(i.source || "feed")}</span></td>
                    <td><strong>${escapeHtml(clean(i.title))}</strong>${i.url ? `<br /><a href="${escapeHtml(i.url)}" target="_blank" rel="noopener" style="color:var(--ink-3); font-size:11px">open source ↗</a>` : ""}</td>
                    <td style="font-family:var(--mono); font-size:11px; color:var(--ink-3)">${i.publishedAt ? new Date(i.publishedAt).toLocaleString() : "—"}</td>
                  </tr>`).join("")}
              </tbody>
            </table>`
          : `<div class="lede" style="padding:14px">No RSS items have been returned yet. Click <strong>Refresh</strong> to hit verified live endpoints (FIFA fixtures, FIFA teams, FIFA tournament facts, CDC travel notices).</div>`;

        $("#live").innerHTML = `
          ${renderKpis()}
          ${renderLiveCard()}
          <div class="fill grid-2">
            <div class="card">
              <div class="card-head"><h3>Verified Live Sources</h3><span class="meta">FIFA · CDC · partners</span></div>
              <div class="card-body"><div class="list">${sourceList}</div></div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Latest Headlines</h3><span class="meta">${items.length} items</span></div>
              <div class="card-body flush"><div class="table-wrap">${itemTable}</div></div>
            </div>
          </div>`;
      }

      function renderMapSection() {
        const focus = stadiums.find(s => s.city === state.city) || stadiums[0];
        $("#map").innerHTML = `
          ${renderKpis()}
          <div class="fill" style="display:grid; grid-template-columns: minmax(0,1.5fr) minmax(0,1fr); gap:12px;">
            ${renderMapCard("detail")}
            <div class="card">
              <div class="card-head"><h3>${focus.city}</h3><span class="meta">${focus.country}</span></div>
              <div class="card-body">
                <div class="list">
                  ${listRow("Venue", `<strong>${focus.venue}</strong>`)}
                  ${listRow("Capacity", focus.cap.toLocaleString())}
                  ${listRow("Role", focus.role)}
                  ${listRow("Coordinates", `<span style="font-family:var(--mono); font-size:11px">${focus.lat.toFixed(2)}, ${focus.lng.toFixed(2)}</span>`)}
                </div>
                <button class="btn dark" data-open-city="${focus.city}" style="margin-top:14px; width:100%">Open city brief →</button>
              </div>
            </div>
          </div>`;
      }

      function renderStadiums() {
        const q = state.stadiumQuery.toLowerCase();
        const { key, dir } = state.stadiumSort;
        const filtered = stadiums.filter(s =>
          !q || s.city.toLowerCase().includes(q) || s.country.toLowerCase().includes(q)
            || s.venue.toLowerCase().includes(q) || s.role.toLowerCase().includes(q)
        );
        const sorted = filtered.slice().sort((a, b) => {
          const av = a[key], bv = b[key];
          const cmp = typeof av === "number" ? av - bv : String(av).localeCompare(String(bv));
          return dir === "asc" ? cmp : -cmp;
        });
        const arrow = (k) => key === k ? (dir === "asc" ? " ↑" : " ↓") : "";
        $("#stadiums").innerHTML = `
          ${renderKpis()}
          <div class="fill">
            <div class="card">
              <div class="card-head">
                <h3>Stadium Register</h3>
                <div style="display:flex; gap:8px; align-items:center">
                  <input class="input" id="stadiumSearch" type="search" placeholder="Search city, venue, role…"
                    value="${escapeHtml(state.stadiumQuery)}"
                    style="height:30px; padding:0 10px; border-radius:8px; border:1px solid var(--line); background:var(--white); font-size:12px; min-width:220px"
                    autocomplete="off" />
                  <span class="meta">${sorted.length}/${stadiums.length} venues</span>
                </div>
              </div>
              <div class="card-body flush"><div class="table-wrap">
                <table>
                  <thead><tr>
                    <th data-sort="city" style="cursor:pointer">City${arrow("city")}</th>
                    <th data-sort="country" style="cursor:pointer">Country${arrow("country")}</th>
                    <th data-sort="venue" style="cursor:pointer">Venue${arrow("venue")}</th>
                    <th data-sort="cap" style="cursor:pointer">Capacity${arrow("cap")}</th>
                    <th data-sort="role" style="cursor:pointer">Role${arrow("role")}</th>
                  </tr></thead>
                  <tbody>
                    ${sorted.map(s => `
                      <tr data-focus-city="${escapeHtml(s.city)}" style="cursor:pointer">
                        <td><strong>${s.city}</strong></td>
                        <td>${s.country}</td>
                        <td>${s.venue}</td>
                        <td style="font-family:var(--mono)">${s.cap.toLocaleString()}</td>
                        <td>${s.role}</td>
                      </tr>
                    `).join("")}
                    ${sorted.length === 0 ? `<tr><td colspan="5" style="text-align:center; color:var(--ink-3); padding:24px">No venues match "${escapeHtml(state.stadiumQuery)}"</td></tr>` : ""}
                  </tbody>
                </table>
              </div></div>
            </div>
          </div>`;
        const search = $("#stadiumSearch");
        if (search) {
          search.addEventListener("input", (e) => {
            state.stadiumQuery = e.target.value;
            renderStadiums();
            const s = $("#stadiumSearch"); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); }
          });
        }
      }

      function renderGrants() {
        const liveGrantRows = state.grantSources.length
          ? state.grantSources.map(s => `<div class="list-row"><span class="lbl"><strong>${escapeHtml(s.name)}</strong></span><span class="val"><span class="pill ${s.status==="live"||s.status==="reachable"?"ok":"warn"} dot">${escapeHtml(prettyStatus(s.status))}</span></span></div>`).join("")
          : grants.map(g => `<div class="list-row"><span class="lbl"><strong>${g[0]} · ${g[1]}</strong></span><span class="val"><span class="pill">${g[2]} · ${g[3]}</span></span></div>`).join("");

        $("#grants").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-2">
            <div class="card">
              <div class="card-head"><h3>Open Grants</h3><button class="btn" id="grantRefresh" type="button">Refresh</button></div>
              <div class="card-body"><div class="list">${liveGrantRows}</div></div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Scale Partners</h3><span class="meta">Fund development</span></div>
              <div class="card-body">
                <div class="list">
                  ${listRow("The Defiant Foundation", `<span class="pill">Program design</span>`)}
                  ${listRow("Bulle Consulting", `<span class="pill">Fund development</span>`)}
                  ${listRow("DreamCo Management", `<span class="pill">Marketing strategy</span>`)}
                </div>
              </div>
            </div>
          </div>`;
      }

      function renderBusiness() {
        $("#business").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-3">
            ${simpleCard("Business Exposure", "Local restaurants, retailers, wellness providers, creators, and nonprofits package watch-party readiness, QR capture, sponsor reporting, and multilingual fan messaging.")}
            ${simpleCard("Partner Lane", "The Defiant Foundation, Bulle Consulting, and DreamCo Management help organizations scale fund development and World Cup marketing city by city.")}
            ${simpleCard("Operating Rule", "Keep activations safe, measurable, language-accessible, and sponsor-ready — without cluttering the fan journey.")}
          </div>`;
      }

      function renderTransport() {
        $("#transport").innerHTML = `
          ${renderKpis()}
          <div class="fill">
            <div class="card">
              <div class="card-head"><h3>Transportation Advisories</h3><span class="meta">Match-day mobility</span></div>
              <div class="card-body flush"><div class="table-wrap">
                <table>
                  <thead><tr><th>Market</th><th>Type</th><th>Asset</th><th>Status</th><th>Source</th></tr></thead>
                  <tbody>
                    ${transitRows.map(r => `<tr><td><strong>${r[0]}</strong></td><td>Advisory</td><td>${r[1]}</td><td><span class="pill ok dot">Match-day</span></td><td>Live agency check when connected</td></tr>`).join("")}
                  </tbody>
                </table>
              </div></div>
            </div>
          </div>`;
      }

      function renderSafety() {
        $("#safety").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-3">
            ${simpleCard("Mass Gatherings", "Crowd movement, emergency exits, accessibility, hydration, and venue-entry procedures.")}
            ${simpleCard("Health Protocols", "Respiratory readiness, stay-home-when-sick guidance, hand hygiene, ventilation awareness, and medical escalation.")}
            ${simpleCard("Fan Stewardship", "Clear signage, multilingual alerts, staff escalation, transit dispersal, and incident reporting.")}
          </div>`;
      }

      function renderMarathon() {
        $("#marathon").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-2">
            <div class="card">
              <div class="card-head"><h3>The Marathon Clothing</h3><a class="btn dark" href="https://www.themarathonclothing.com/" target="_blank" rel="noopener">Visit store ↗</a></div>
              <div class="card-body">
                <p class="lede"><strong>The Marathon Continues.</strong> A culture-and-commerce homage to Nipsey Hussle, Blacc Sam, and Steven Carless, integrated inside the Defiant Sports platform.</p>
                <blockquote style="border-left:3px solid var(--ink); padding:6px 0 6px 14px; margin:18px 0 0; font-size:18px; font-weight:800; letter-spacing:-.02em">"We honor the people that ain't quit, we honor the people that stayed down."</blockquote>
              </div>
            </div>
            <div class="card">
              <div class="card-head"><h3>Legacy Register</h3></div>
              <div class="card-body">
                <div class="list">
                  ${listRow("Nipsey Hussle", `<span class="pill">Ownership legacy</span>`)}
                  ${listRow("Blacc Sam", `<span class="pill">Family stewardship</span>`)}
                  ${listRow("Steven Carless", `<span class="pill">Culture strategy</span>`)}
                </div>
              </div>
            </div>
          </div>`;
      }

      function renderYouth() {
        $("#youth").innerHTML = `
          ${renderKpis()}
      <div class="fill" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 360px)); gap:12px; justify-content:start; align-content:start;">
            ${simpleCard("World Cup Access", "Youth from different cultural backgrounds receive soccer learning, match-day context, and safe fan experiences.")}
            ${simpleCard("Futsal", "Compact tournaments for gyms, courts, mini-pitches, and community centers.")}
            ${simpleCard("Mentor Network", "Coaches, translators, nonprofits, safety leads, and city partners operating together.")}
          </div>`;
      }

      function renderRecords() {
        $("#records").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-3">
            ${simpleCard("Player Narratives", "Source-safe profiles, multilingual press lines, and sponsor-ready story pillars.")}
            ${simpleCard("Culture Campaigns", "Music, creators, watch parties, local artists, and city-specific content.")}
            ${simpleCard("Rights Review", "Controls before using player names, images, team marks, or tournament marks commercially.")}
          </div>`;
      }

      function renderTranslate() {
        $("#translate").innerHTML = `
          ${renderKpis()}
          <div class="fill">
            <div class="card">
              <div class="card-head"><h3>Language Access Matrix</h3><span class="meta">${countries.length} markets</span></div>
              <div class="card-body flush"><div class="table-wrap">
                <table>
                  <thead><tr><th>Market</th><th>Type</th><th>Languages</th><th>Coverage</th><th>Notes</th></tr></thead>
                  <tbody>
                    ${countries.map(c => `<tr><td><strong>${c[0]}</strong></td><td><span class="pill">${c[1]}</span></td><td>${c[2]}</td><td>Dashboard coverage</td><td>Human review for emergency copy</td></tr>`).join("")}
                  </tbody>
                </table>
              </div></div>
            </div>
          </div>`;
      }

      function renderBracket() {
  $("#bracket").innerHTML = `
    ${renderKpis()}
    <div class="fill" style="overflow:auto">
      <div class="card">
        <div class="card-head"><h3>FIFA World Cup 2026 — Bracket</h3><span class="meta">Jun 11 – Jul 19, 2026 · 48 teams · 104 matches · 16 host cities</span></div>
        <div class="card-body">
          <p class="lede"><strong>Format:</strong> 12 groups of 4 → top 2 of each group + 8 best third-placed teams advance to the Round of 32 → R16 → QF → SF → 3rd-place match → Final. Hosts <strong>Canada, Mexico, USA</strong> qualify automatically.</p>
          <p class="lede" style="margin-top:6px"><strong>Opener:</strong> Mexico vs TBD — Estadio Azteca, Mexico City — Jun 11, 2026 · <strong>Final:</strong> MetLife Stadium, New York/New Jersey — Jul 19, 2026</p>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Group Stage — 12 Groups of 4</h4>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px;">
            ${[
              ["A","Mexico (host)"],["B","Canada (host)"],["C","TBD"],["D","USA (host)"],
              ["E","TBD"],["F","TBD"],["G","TBD"],["H","TBD"],
              ["I","TBD"],["J","TBD"],["K","TBD"],["L","TBD"]
            ].map(g => `<div style="border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface)"><strong>Group ${g[0]}</strong><ol style="margin:6px 0 0; padding-left:18px; font-size:12px; color:var(--ink-2)"><li>${g[1]}</li><li>TBD</li><li>TBD</li><li>TBD</li></ol></div>`).join("")}
          </div>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Knockout Stage</h4>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px;">
            ${[
              ["Round of 32","32 teams · first knockout"],
              ["Round of 16","16 teams"],
              ["Quarter-finals","8 teams"],
              ["Semi-finals","Jul 14 Dallas · Jul 15 Atlanta"],
              ["3rd-place","Jul 18 · Miami"],
              ["Final","Jul 19 · MetLife (NY/NJ)"]
            ].map(r => `<div style="border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface)"><strong>${r[0]}</strong><div style="font-size:11.5px; color:var(--ink-3); margin-top:4px">${r[1]}</div></div>`).join("")}
          </div>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Host Cities (16)</h4>
          <p class="lede"><strong>Mexico:</strong> Mexico City (Estadio Azteca), Guadalajara, Monterrey · <strong>Canada:</strong> Toronto, Vancouver · <strong>USA:</strong> Atlanta, Boston, Dallas, Houston, Kansas City, Los Angeles, Miami, New York/New Jersey, Philadelphia, San Francisco Bay Area, Seattle</p>
        </div>
      </div>
    </div>`;      }

      function simpleCard(title, copy) {
        return `
          <div class="card">
            <div class="card-head"><h3>${title}</h3></div>
            <div class="card-body"><p class="lede">${copy}</p></div>
          </div>`;
      }

      // ───────────────── Active view ─────────────────
      function renderActive() {
        renderNav();
        const meta = views.find(v => v[0] === state.view);
        $("#viewTitle").textContent = meta ? meta[1] : "Overview";
        const crumbs = {
          overview: "Real-time host-city intelligence · FIFA World Cup 2026",
          live: "Verified FIFA · CDC · partner endpoints · streaming when reachable",
          map: "Interactive 16-city host map · click pins for detail",
          stadiums: "Verified venue register · 16 host stadiums",
          grants: "Open grants & funding pathways · live status",
          business: "Local-market activation strategy",
          transport: "Match-day mobility advisories",
          safety: "Stewardship, health, and fan-flow",
          marathon: "The Marathon Continues · culture & commerce",
          youth: "Youth programming · futsal · mentorship",
          records: "Narratives, campaigns, and rights",
          translate: "Multilingual coverage matrix",
          bracket: "Tournament framework"
        };
        $("#viewCrumb").textContent = crumbs[state.view] || "";

        $$(".section").forEach(s => s.classList.toggle("active", s.id === state.view));

        const r = {
          overview: renderOverview, live: renderLiveSection, map: renderMapSection,
          stadiums: renderStadiums, grants: renderGrants, business: renderBusiness,
          transport: renderTransport, safety: renderSafety, marathon: renderMarathon,
          youth: renderYouth, records: renderRecords, translate: renderTranslate,
          bracket: renderBracket
        }[state.view];
        if (r) r();

        const chip = $("#liveChip");
        const isLive = state.live === "connected";
        chip.classList.toggle("off", !isLive);
        $("#liveLabel").textContent = isLive ? "Live · streaming" : `Live · ${state.live}`;
        $("#footPing").classList.toggle("live", isLive);

        requestAnimationFrame(() => {
          initVisibleMaps();
          animateCountUps();
        });
      }

      function initVisibleMaps() {
        ["hostMap_overview", "hostMap_detail"].forEach((id) => {
          const el = document.getElementById(id);
          if (!el || !window.L) return;
          if (maps[id]) {
            try { maps[id].remove(); } catch {}
            delete maps[id];
            delete markerLayers[id];
          }
          const map = L.map(id, { zoomControl: true, scrollWheelZoom: false, attributionControl: false }).setView([39.5, -98], 3);
          L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
            attribution: "© OpenStreetMap · © CARTO",
            maxZoom: 18,
            subdomains: "abcd"
          }).addTo(map);
          L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png", {
            maxZoom: 18, subdomains: "abcd"
          }).addTo(map);
          L.control.attribution({ position: "bottomright", prefix: false })
            .addAttribution("© OpenStreetMap · © CARTO").addTo(map);
          maps[id] = map;
          markerLayers[id] = L.layerGroup().addTo(map);
          stadiums.forEach((s) => {
            const selected = s.city === state.city;
            const marker = L.marker([s.lat, s.lng], {
              icon: L.divIcon({
                className: "",
                html: `<span class="host-marker ${selected ? "active" : ""}"></span>`,
                iconSize: selected ? [16, 16] : [12, 12],
                iconAnchor: selected ? [8, 8] : [6, 6]
              })
            }).addTo(markerLayers[id]);
            marker.bindTooltip(`${s.city} · ${s.venue}`, { direction: "top", offset: [0, -4] });
            marker.on("click", () => {
              state.city = s.city;
              renderActive();
            });
          });
          setTimeout(() => map.invalidateSize(), 30);
        });
      }

      // ───────────────── Live data ─────────────────
      async function refreshLive() {
        state.live = "checking";
        state.grantLive = "checking";
        renderActive();
        toast("Querying verified live sources…");
        try {
          const [live, grant] = await Promise.allSettled([
            fetch("/api/live-feeds"),
            fetch("/api/grant-feeds")
          ]);
          if (live.status === "fulfilled" && live.value.ok) {
            const payload = await live.value.json();
            state.live = "connected";
            state.liveSources = payload.sources || [];
            state.liveItems = payload.items || [];
            state.generatedAt = payload.generatedAt || null;
          } else {
            state.live = "unavailable";
          }
          if (grant.status === "fulfilled" && grant.value.ok) {
            const payload = await grant.value.json();
            state.grantLive = "connected";
            state.grantSources = payload.sources || [];
            state.grantItems = payload.items || [];
            state.grantGeneratedAt = payload.generatedAt || null;
          } else {
            state.grantLive = "unavailable";
          }
          toast(state.live === "connected" ? "Live sources synced." : "Live API unreachable — running in static mode.");
        } catch {
          state.live = "unavailable";
          state.grantLive = "unavailable";
          toast("Live API unreachable — running in static mode.");
        }
        renderActive();
      }

      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove("show"), 2400);
      }

      function openModal(title, body) {
        $("#modalTitle").textContent = title;
        $("#modalBody").innerHTML = body;
        $("#modal").classList.add("open");
      }

      // ───────────────── Events ─────────────────
      document.addEventListener("click", (e) => {
        const navBtn = e.target.closest("[data-view]");
        if (navBtn) {
          state.view = navBtn.dataset.view;
          renderActive();
          return;
        }
        const sortHeader = e.target.closest("th[data-sort]");
        if (sortHeader) {
          const k = sortHeader.dataset.sort;
          if (state.stadiumSort.key === k) {
            state.stadiumSort.dir = state.stadiumSort.dir === "asc" ? "desc" : "asc";
          } else {
            state.stadiumSort = { key: k, dir: k === "cap" ? "desc" : "asc" };
          }
          renderStadiums();
          return;
        }
        const focusRow = e.target.closest("[data-focus-city]");
        if (focusRow) {
          const city = focusRow.dataset.focusCity;
          if (stadiums.some(s => s.city === city)) {
            state.city = city;
            state.view = "map";
            renderActive();
            toast(`Focused ${city}`);
          }
          return;
        }
        const openCity = e.target.closest("[data-open-city]");
        if (openCity) {
          const s = stadiums.find(x => x.city === openCity.dataset.openCity);
          if (s) {
            openModal(s.city, `
              <div class="list">
                ${listRow("Venue", `<strong>${s.venue}</strong>`)}
                ${listRow("Country", s.country)}
                ${listRow("Capacity", s.cap.toLocaleString())}
                ${listRow("Role", s.role)}
                ${listRow("Coordinates", `<span style="font-family:var(--mono)">${s.lat.toFixed(3)}, ${s.lng.toFixed(3)}</span>`)}
                ${listRow("Operational focus", "Transit · safety · business · language access")}
              </div>`);
          }
          return;
        }
        if (e.target.id === "grantRefresh") refreshLive();
        if (e.target.id === "modal") $("#modal").classList.remove("open");
      });

      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, select, textarea")) return;
        const map = { "1":"overview","2":"live","3":"map","4":"stadiums","5":"grants","6":"business","7":"transport","8":"safety","9":"marathon","0":"youth" };
        if (map[e.key]) { state.view = map[e.key]; renderActive(); }
        if (e.key === "Escape") $("#modal").classList.remove("open");
      });

      $("#refreshBtn").addEventListener("click", refreshLive);
      $("#printBtn").addEventListener("click", () => window.print());
      $("#languageSelect").addEventListener("change", (e) => {
        document.documentElement.lang = e.target.value;
        document.documentElement.dir = e.target.value === "ar" ? "rtl" : "ltr";
        toast(`Language: ${e.target.value.toUpperCase()}`);
      });
      $("#closeModal").addEventListener("click", () => $("#modal").classList.remove("open"));
      $("#menuBtn")?.addEventListener("click", () => {
        document.querySelector(".nav").scrollIntoView({ behavior: "smooth" });
      });

      // Init
      renderActive();
      refreshLive();
      setInterval(refreshLive, 5 * 60 * 1000);
    </script>
  </body>
</html>
