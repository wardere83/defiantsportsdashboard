<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Defiant Sports World Cup 2026 Dashboard</title>
    <meta
      name="description"
      content="A monochrome, interactive Defiant Sports dashboard for FIFA World Cup 2026 host cities, stadiums, transportation, open nonprofit funding, fan safety, business exposure, cultural partnerships, and verified source tracking."
    />
    <meta property="og:title" content="Defiant Sports World Cup 2026 Dashboard" />
    <meta
      property="og:description"
      content="Interactive World Cup 2026 fan operations dashboard with source-linked stadium, safety, grant, transportation, business, Marathon Clothing, Pogba Academy, and Defiant Records sections."
    />
    <meta property="og:type" content="website" />
    <style>
      :root {
        --bg: #f2f2f2;
        --surface: #f7f7f7;
        --text: #000000;
        --text-secondary: #4f4f4f;
        --text-muted: #9e9e9e;
        --border: #d1d1d1;
        --cta: #000000;
        --cta-text: #ffffff;
        --shadow: 0 16px 42px rgba(0, 0, 0, 0.08);
        --radius: 22px;
        --radius-sm: 14px;
        --sidebar: 286px;
        --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.5;
      }

      a {
        color: inherit;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .app {
        display: grid;
        min-height: 100vh;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid var(--border);
        background: #000000;
        color: #ffffff;
        padding: 22px 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 22px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      }

      .brand img {
        width: 108px;
        height: auto;
        border-radius: 8px;
        background: #ffffff;
      }

      .brand small {
        display: block;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.68);
        font-size: 12px;
      }

      .nav {
        display: grid;
        gap: 8px;
        margin-top: 24px;
      }

      .nav button {
        display: flex;
        width: 100%;
        align-items: center;
        justify-content: space-between;
        border: 1px solid transparent;
        border-radius: 18px;
        background: transparent;
        color: #ffffff;
        padding: 14px 14px;
        text-align: left;
        transition:
          background 160ms ease,
          color 160ms ease,
          border-color 160ms ease;
      }

      .nav button span {
        display: block;
      }

      .nav button small {
        display: block;
        margin-top: 3px;
        color: rgba(255, 255, 255, 0.58);
        font-size: 12px;
      }

      .nav button.active,
      .nav button:hover,
      .nav button:focus-visible {
        background: #ffffff;
        color: #000000;
        outline: none;
      }

      .nav button.active small,
      .nav button:hover small,
      .nav button:focus-visible small {
        color: #4f4f4f;
      }

      .side-note {
        margin-top: 28px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 16px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
      }

      .content {
        min-width: 0;
      }

      .topbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-bottom: 1px solid var(--border);
        background: rgba(242, 242, 242, 0.94);
        padding: 16px 24px;
        backdrop-filter: blur(12px);
      }

      .topbar-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 10px;
      }

      .page {
        padding: 24px;
      }

      .section {
        display: none;
      }

      .section.active {
        display: block;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        padding: 7px 12px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        letter-spacing: -0.04em;
        line-height: 1.04;
      }

      h1 {
        font-size: clamp(30px, 3vw, 46px);
      }

      h2 {
        font-size: clamp(26px, 2.2vw, 34px);
      }

      h3 {
        font-size: 20px;
      }

      p {
        margin: 0;
      }

      .muted {
        color: var(--text-secondary);
      }

      .faint {
        color: var(--text-muted);
      }

      .hero {
        display: grid;
        gap: 22px;
        grid-template-columns: minmax(0, 1fr) 380px;
        align-items: stretch;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .card.flat {
        box-shadow: none;
      }

      .card-header {
        border-bottom: 1px solid var(--border);
        padding: 20px;
      }

      .card-body {
        padding: 20px;
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.three {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .stat {
        min-height: 160px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 20px;
      }

      .stat .label {
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .stat .value {
        margin-top: 24px;
        font-size: 32px;
        font-weight: 950;
        letter-spacing: -0.06em;
      }

      .stat .detail {
        margin-top: 10px;
        color: var(--text-secondary);
        font-size: 14px;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin: 16px 0;
      }

      .field,
      .button,
      .select {
        min-height: 42px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        color: var(--text);
        padding: 0 15px;
      }

      .field {
        min-width: 280px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
        transition:
          background 160ms ease,
          color 160ms ease,
          border-color 160ms ease,
          transform 160ms ease;
      }

      .button.primary {
        border-color: var(--cta);
        background: var(--cta);
        color: var(--cta-text);
      }

      .button:hover,
      .button:focus-visible {
        border-color: #000000;
        transform: translateY(-1px);
        outline: none;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.35);
        padding: 16px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 5px 10px;
        color: var(--text-secondary);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .tabs-inline {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .tabs-inline button {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface);
        padding: 10px 14px;
      }

      .tabs-inline button.active {
        border-color: #000000;
        background: #000000;
        color: #ffffff;
      }

      .source-link {
        font-weight: 800;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: block;
      }

      .bracket-grid {
        display: grid;
        gap: 14px;
        grid-template-columns: repeat(6, minmax(150px, 1fr));
        overflow-x: auto;
        padding-bottom: 6px;
      }

      .round {
        min-width: 150px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.35);
        padding: 14px;
      }

      .round strong {
        display: block;
        margin-bottom: 10px;
      }

      .match-slot {
        border-top: 1px solid var(--border);
        padding: 10px 0;
        color: var(--text-secondary);
        font-size: 13px;
      }

      .source-status {
        display: grid;
        gap: 10px;
      }

      .meter {
        overflow: hidden;
        height: 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #ffffff;
      }

      .meter span {
        display: block;
        width: var(--value, 0%);
        height: 100%;
        background: #000000;
      }

      .modal {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.5);
        padding: 18px;
      }

      .modal.open {
        display: flex;
      }

      .modal-card {
        width: min(720px, 100%);
        max-height: 88vh;
        overflow: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .quote {
        border-left: 4px solid #000000;
        padding: 10px 0 10px 18px;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.04em;
      }

      .notice {
        border: 1px dashed var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.42);
        padding: 16px;
        color: var(--text-secondary);
      }

      .mobile-toggle {
        display: none;
      }

      @media (max-width: 1100px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: fixed;
          z-index: 30;
          inset: 0 auto 0 0;
          width: min(320px, 86vw);
          transform: translateX(-105%);
          transition: transform 180ms ease;
        }

        .sidebar.open {
          transform: translateX(0);
        }

        .mobile-toggle {
          display: inline-flex;
        }

        .hero,
        .grid.two,
        .grid.three,
        .grid.four {
          grid-template-columns: 1fr;
        }

        .field {
          width: 100%;
          min-width: 0;
        }
      }

      @media (max-width: 680px) {
        .topbar,
        .page {
          padding: 14px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .row {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar" aria-label="Dashboard navigation">
        <div class="brand">
          <img src="./assets/defiant-sports-logo.jpeg" alt="Defiant Sports logo" />
          <div>
            <strong>Defiant Sports</strong>
            <small>World Cup 2026</small>
          </div>
        </div>

        <nav class="nav" id="mainNav"></nav>

        <div class="side-note">
          <strong>Verified-source mode</strong>
          <p style="margin-top: 8px">No fabricated feeds, match results, grant openings, or final squad claims are displayed.</p>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button class="button mobile-toggle" id="menuButton" type="button">Menu</button>
          <div>
            <span class="eyebrow" data-i18n="platformEyebrow">Private planning dashboard</span>
            <h1 id="pageTitle" data-i18n="overviewTitle">Command Center</h1>
          </div>
          <div class="topbar-actions">
            <select class="select" id="languageSelect" aria-label="Dashboard language">
              <option value="en">English</option>
              <option value="es">Español</option>
              <option value="fr">Français</option>
              <option value="pt">Português</option>
              <option value="de">Deutsch</option>
              <option value="ar">العربية</option>
            </select>
            <button class="button" id="refreshFeeds" type="button" data-i18n="refreshSources">Refresh live sources</button>
            <a class="button primary" href="https://www.fifa.com/en/tournaments/mens/worldcup/canadamexicousa2026" target="_blank" rel="noopener" data-i18n="fifaSource">FIFA source</a>
          </div>
        </header>

        <div class="page">
          <section class="section active" id="overview"></section>
          <section class="section" id="stadiums"></section>
          <section class="section" id="bracket"></section>
          <section class="section" id="teams"></section>
          <section class="section" id="grants"></section>
          <section class="section" id="transport"></section>
          <section class="section" id="business"></section>
          <section class="section" id="safety"></section>
          <section class="section" id="marathon"></section>
          <section class="section" id="youth"></section>
          <section class="section" id="records"></section>
          <section class="section" id="translations"></section>
          <section class="section" id="sources"></section>
        </div>
      </main>
    </div>

    <div class="modal" id="detailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="card-header row">
          <div>
            <span class="eyebrow">Detail</span>
            <h2 id="modalTitle" style="margin-top: 10px">Detail</h2>
          </div>
          <button class="button" id="closeModal" type="button">Close</button>
        </div>
        <div class="card-body" id="modalBody"></div>
      </div>
    </div>

            ${partnerCard("Mentor operations", "Leadership", "Pair coaches, translators, player-storytelling, safety leads, and nonprofit partners in each host city.")}
          </div>
          <div class="card" style="margin-top: 18px"><div class="card-body"><h3>Funding alignment</h3><p class="muted" style="margin-top: 10px">Connect this lane to Seattle Small Sparks, LA84 youth sports, GA 100 mini-pitch, and U.S. Soccer Foundation safe-play source tracks where eligible.</p></div></div>
        `;
      }

      function renderRecords() {
        $("#records").innerHTML = `
          ${sectionIntro("recordsTitle", "Defiant Records focuses on branding strategies that connect players, music, culture, sponsors, community activations, and fan storytelling without inventing player endorsements.")}
          <div class="grid three">
            ${partnerCard("Player narrative strategy", "Branding", "Build source-safe profiles, social arcs, multilingual press lines, and sponsor-safe story pillars.")}
            ${partnerCard("Music and culture campaigns", "Activation", "Pair watch parties, local artists, creator content, and city-specific fan moments.")}
            ${partnerCard("Rights-safe execution", "Compliance", "Use public sources, official links, and clear rights reviews before using player names, images, team marks, or tournament marks commercially.")}
          </div>
        `;
      }

      function renderTranslations() {
        $("#translations").innerHTML = `
          ${sectionIntro("translationsTitle", "The language system provides operational UI translation and a country-language matrix. Final country coverage should sync to FIFA's official team list as the tournament field changes.")}
          <div class="notice">Use the language selector in the top bar to translate dashboard navigation and operational chrome. Event-specific safety, legal, and emergency content should be human-reviewed before publication.</div>
          <div class="grid two" style="margin-top: 18px">
            ${COUNTRY_SPOTLIGHTS.map(([country, status, languages, note]) => `<div class="row"><div><strong>${country}</strong><p class="muted">${languages}</p></div><span class="tag">${status}</span></div>`).join("")}
          </div>
        `;
      }

      function renderSources() {
        $("#sources").innerHTML = `
          ${sectionIntro("sourcesTitle", "All factual modules are backed by official or verified source links. Same-origin API checks are optional and never create fabricated records.")}
          <div class="list">
            ${SOURCE_CHECKS.map(([label, url]) => `<div class="row"><div><strong>${label}</strong><p class="muted">${url}</p></div>${source("Open", url)}</div>`).join("")}
          </div>
        `;
      }

      function sectionIntro(key, body) {
        return `<div class="card" style="margin-bottom: 18px"><div class="card-body"><span class="eyebrow" data-i18n="${key}">${TRANSLATIONS[state.lang][key]}</span><h2 style="margin-top: 14px">${TRANSLATIONS[state.lang][key]}</h2><p class="muted" style="margin-top: 12px">${body}</p></div></div>`;
      }

      function renderSourceSummary() {
        const statusText = state.sourceState === "live" ? "Connected to live endpoint" : state.sourceState === "error" ? "Live endpoint unavailable" : "Ready to check";
        $("#sourceSummary").innerHTML = `
          <div class="row">
            <div><strong>${statusText}</strong><p class="muted">Same-origin endpoints checked: /api/live-feeds and /api/grant-feeds</p></div>
            <span class="tag">${state.sourceState}</span>
          </div>
          ${SOURCE_CHECKS.slice(0, 5).map(([label, url]) => `<div class="row"><div><strong>${label}</strong><p class="muted">Verified source</p></div>${source("Open", url)}</div>`).join("")}
        `;
      }

      function renderAll() {
        renderNav();
        renderOverview();
        renderStadiums();
        renderBracket();
        renderTeams();
        renderGrants();
        renderTransport();
        renderBusiness();
        renderSafety();
        renderMarathon();
        renderYouth();
        renderRecords();
        renderTranslations();
        renderSources();
        renderSourceSummary();
        applyLanguage();
      }

      function switchSection(id) {
        state.section = id;
        $$(".section").forEach((section) => section.classList.toggle("active", section.id === id));
        renderNav();
        const navItem = NAV.find((item) => item[0] === id);
        if (navItem) $("#pageTitle").textContent = TRANSLATIONS[state.lang][navItem[1]];
        $("#sidebar").classList.remove("open");
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function checkLiveFeeds() {
        state.sourceState = "checking";
        renderSourceSummary();
        try {
          const [live, grants] = await Promise.all([
            fetch("/api/live-feeds", { headers: { Accept: "application/json" } }),
            fetch("/api/grant-feeds", { headers: { Accept: "application/json" } })
          ]);
          if (!live.ok || !grants.ok) throw new Error("Endpoint unavailable");
          state.sourceState = "live";
        } catch (error) {
          state.sourceState = "error";
        }
        renderSourceSummary();
      }

      async function checkGrantEndpoint() {
        const target = $("#grantEndpointStatus");
        if (!target) return;
        target.textContent = "Checking /api/grant-feeds...";
        try {
          const response = await fetch("/api/grant-feeds", { headers: { Accept: "application/json" } });
          if (!response.ok) throw new Error("Endpoint unavailable");
          const data = await response.json();
          target.innerHTML = `Live grant endpoint connected. ${data.sources?.length || 0} source records returned; no fabricated grant records added.`;
        } catch (error) {
          target.innerHTML = "Live grant endpoint unavailable in static mode. This is safe: verified grant cards remain visible, and the page does not invent live grant records.";
        }
      }

      function openModal(title, body) {
        $("#modalTitle").textContent = title;
        $("#modalBody").innerHTML = body;
        $("#detailModal").classList.add("open");
      }

      function applyLanguage() {
        const dict = TRANSLATIONS[state.lang] || TRANSLATIONS.en;
        $$("[data-i18n]").forEach((el) => {
          const key = el.dataset.i18n;
          if (dict[key]) el.textContent = dict[key];
        });
        const navItem = NAV.find((item) => item[0] === state.section);
        if (navItem) $("#pageTitle").textContent = dict[navItem[1]];
        document.documentElement.lang = state.lang;
        document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
      }

      document.addEventListener("click", (event) => {
        const nav = event.target.closest("[data-nav]");
        if (nav) switchSection(nav.dataset.nav);

        const go = event.target.closest("[data-go]");
        if (go) switchSection(go.dataset.go);

        const detail = event.target.closest("[data-detail]");
        if (detail) {
          const city = detail.dataset.detail;
          const venue = STADIUMS.find((item) => item[0] === city);
          if (venue) {
            openModal(`${venue[0]} operating brief`, `
              <p><strong>Venue:</strong> ${venue[2]}</p>
              <p style="margin-top: 10px"><strong>Capacity:</strong> ${venue[3]} preliminary FIFA-listed capacity.</p>
              <p style="margin-top: 10px"><strong>Fixture allocation:</strong> ${venue[4]}</p>
              <p class="notice" style="margin-top: 14px">Operations focus: transit route confirmation, accessibility messaging, hydration planning, local business coordination, language support, and post-match dispersal.</p>
              <div class="toolbar">${source("FIFA stadium source", venue[5])}</div>
            `);
          }
        }

        const round = event.target.closest("[data-round]");
        if (round) {
          const rounds = [
            ["Group stage", "12 groups of four", "Top two from each group plus eight best third-place teams advance."],
            ["Round of 32", "32 teams", "First knockout round under the expanded format."],
            ["Round of 16", "16 teams", "Winner-take-all knockout fixtures."],
            ["Quarter-finals", "8 teams", "Four matches across assigned venues."],
            ["Semi-finals", "4 teams", "Atlanta Stadium and Dallas Stadium are FIFA-listed semi-final venues."],
            ["Final", "2 teams", "FIFA lists New York New Jersey Stadium for the final on 19 July 2026."]
          ];
          updateRoundDetail(rounds, Number(round.dataset.round));
        }
      });

      document.addEventListener("input", (event) => {
        if (event.target.id === "stadiumSearch") {
          state.stadiumQuery = event.target.value;
          renderStadiums();
        }
        if (event.target.id === "grantSearch") {
          state.grantQuery = event.target.value;
          renderGrants();
        }
        if (event.target.id === "teamSearch") {
          state.teamQuery = event.target.value;
          renderTeams();
        }
      });

      document.addEventListener("change", (event) => {
        if (event.target.id === "languageSelect") {
          state.lang = event.target.value;
          renderAll();
          switchSection(state.section);
        }
        if (event.target.id === "businessCity") {
          state.businessCity = event.target.value;
          renderBusiness();
        }
        if (event.target.id === "businessType") {
          state.businessType = event.target.value;
          renderBusiness();
        }
      });

      $("#refreshFeeds").addEventListener("click", checkLiveFeeds);
      $("#menuButton").addEventListener("click", () => $("#sidebar").classList.add("open"));
      $("#closeModal").addEventListener("click", () => $("#detailModal").classList.remove("open"));
      $("#detailModal").addEventListener("click", (event) => {
        if (event.target.id === "detailModal") $("#detailModal").classList.remove("open");
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") $("#detailModal").classList.remove("open");
      });
      document.addEventListener("click", (event) => {
        if (event.target.id === "grantEndpointButton") checkGrantEndpoint();
      });

      renderAll();
    </script>
  </body>
</html>
