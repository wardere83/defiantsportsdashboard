<!doctype html> 
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Defiant Sports, World Cup 2026 Operations</title>
    <meta
      name="description"
      content="Defiant Sports operations intelligence for FIFA World Cup 2026: live fixtures, host-city stewardship, grants, transportation, safety, and cultural programming."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://unpkg.com" crossorigin />
    <link rel="dns-prefetch" href="https://translate.google.com" />
    <link rel="dns-prefetch" href="https://translate.googleapis.com" />
    <link rel="dns-prefetch" href="https://picsum.photos" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --ink: #0a0a0a;
        --ink-2: #3f3f46;
        --ink-3: #71717a;
        --ink-4: #a1a1aa;
        --line: #e4e4e7;
        --line-2: #d4d4d8;
        --black: #0a0a0a;
        --white: #ffffff;
        --live: #00a650;
        --live-glow: rgba(0, 166, 80, 0.18);
        --warn: #d97706;
        --accent: #1d4ed8;
        --rail: 232px;
        --topbar: 64px;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow-sm: 0 1px 2px rgba(10, 10, 10, 0.04);
        --shadow-md: 0 4px 16px rgba(10, 10, 10, 0.06);
        --shadow-lg: 0 14px 44px rgba(10, 10, 10, 0.10);
        --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        overflow-y: auto;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      /* ─────────── Layout shell ─────────── */
      .app {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
      }

      .rail {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--white);
        border-right: 1px solid var(--line);
        min-width: 0;
        overflow: hidden;
      }

      .brand {
        padding: 22px 20px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .brand img {
        width: 168px;
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }

      .nav {
        padding: 6px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .nav button {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 550;
        font-size: 12.5px;
        letter-spacing: -0.005em;
        transition: background .15s ease, color .15s ease, transform .15s ease;
      }
      .nav button:hover { background: var(--surface-2); color: var(--ink); }
      .nav button.active {
        background: var(--ink);
        color: var(--white);
        box-shadow: var(--shadow-sm);
      }
      .nav .glyph {
        display: grid;
        place-items: center;
        font-size: 13px;
        opacity: .8;
      }
      .nav button.active .glyph { opacity: 1; }
      .nav .kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-4);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .nav button.active .kbd {
        background: rgba(255,255,255,.10);
        border-color: rgba(255,255,255,.18);
        color: rgba(255,255,255,.9);
      }

      .rail-foot {
        border-top: 1px solid var(--line);
        padding: 12px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--ink-3);
      }
      .rail-foot a { font-weight: 600; color: var(--ink); }
      .rail-foot .ping {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ink-4);
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
      }
      .rail-foot .ping.live {
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--live-glow); }
        50% { box-shadow: 0 0 0 8px transparent; }
      }

      /* ─────────── Top bar ─────────── */
      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: var(--topbar);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,.85);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
      }
      .topbar h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .topbar .crumb {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }
      .top-actions { display: flex; align-items: center; gap: 8px; }

      .live-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        font-weight: 600;
        font-size: 11.5px;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow-sm);
      }
      .live-chip .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .live-chip.off { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }
      .live-chip.off .dot { background: var(--ink-4); animation: none; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
      }
      .btn:hover { background: var(--surface-2); }
      .btn:active { transform: translateY(1px); }
      .btn.dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
      .btn.dark:hover { background: #1a1a1a; }
      .btn.icon { width: 32px; padding: 0; }

      .select {
        height: 32px;
        padding: 0 28px 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%2371717a' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 9px center;
        font-size: 12px;
        appearance: none;
        -webkit-appearance: none;
      }

      /* ─────────── Main view ─────────── */
      .view {
        min-width: 0;
        padding: 14px 18px 24px;
      }
      .section { display: none; min-width: 0; }
      .section.active { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .section .fill { min-width: 0; }

      /* Overview = master grid; rows size to content but the map area gets a sensible min-height */
      #overview.section.active {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "kpi    kpi"
          "live   live"
          "map    rail";
        gap: 12px;
      }
      .grid-map { min-height: 480px; }
      .grid-rail { min-height: 480px; }

      .grid-kpi { grid-area: kpi; }
      .grid-live { grid-area: live; }
      .grid-map { grid-area: map; min-height: 0; }
      .grid-rail { grid-area: rail; min-height: 0; }

      /* ─────────── Cards ─────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        row-gap: 4px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-2);
        min-width: 0;
      }
      .card-head .meta {
        font-size: 11px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
        min-width: 0;
      }
      .card-body {
        padding: 12px 14px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .card-body.flush { padding: 0; }

      /* Beyond the Pitch block: heading + horizontally scrolling ticker.
         CSS transform animation (60fps), pauses on hover and focus,
         respects prefers-reduced-motion. */
      .fifa-history-block {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .fifa-history-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 16px 8px 18px;
        position: relative;
      }
      .fifa-history-head::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: #1d4ed8;
      }
      .fifa-history-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
      }
      .fifa-history-head .meta {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .fifa-history-head .live-pulse {
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #1d4ed8;
        box-shadow: 0 0 8px #1d4ed8;
        animation: pulse 1.6s ease-in-out infinite;
      }
      .fifa-ticker {
        position: relative;
        overflow: hidden;
        padding: 10px 0;
        border-top: 1px solid var(--line);
        mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
      }
      /* Beyond the Pitch headline rotator. One headline visible at a
         time, breaking-news banner aesthetic. Crossfade + lift on
         change (~250ms), 7s read window. Pause on hover/focus,
         respects prefers-reduced-motion. */
      .fifa-headline {
        display: flex;
        align-items: center;
        min-height: 56px;
        padding: 14px 18px;
        position: relative;
      }
      .fifa-headline-text {
        font-size: 18px;
        line-height: 1.35;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.012em;
        margin: 0;
        opacity: 1;
        transform: translateY(0);
        transition: opacity 250ms ease, transform 250ms ease;
        will-change: opacity, transform;
      }
      .fifa-headline.changing .fifa-headline-text {
        opacity: 0;
        transform: translateY(6px);
      }
      .fifa-headline-tag {
        display: inline-block;
        background: #b91c1c;
        color: #fff;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        padding: 4px 8px;
        border-radius: 4px;
        margin-right: 10px;
        flex: 0 0 auto;
        align-self: center;
      }
      @media (max-width: 720px) {
        .fifa-headline-text { font-size: 15px; }
        .fifa-headline { min-height: 48px; padding: 12px 14px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .fifa-headline-text { transition: none; }
      }

      /* Black Wall Street rotating card on the Marathon Clothing view.
         4s interval, 300ms fade, prev/next, dot indicators, pauses on
         hover, focus, and when scrolled out of viewport. */
      .bws-card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        overflow: hidden;
      }
      .bws-card::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: #c1272d;
      }
      .bws-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        row-gap: 6px;
        padding: 10px 16px 8px 18px;
      }
      .bws-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink);
        display: flex; align-items: center; gap: 8px;
      }
      .bws-head h3::before {
        content: "";
        width: 7px; height: 7px;
        border-radius: 50%;
        background: #c1272d;
        box-shadow: 0 0 8px #c1272d;
      }
      .bws-controls {
        display: flex;
        gap: 6px;
      }
      .bws-controls button {
        width: 32px; height: 32px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease;
      }
      .bws-controls button:hover { background: var(--surface-2); border-color: var(--line-2); }
      .bws-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .bws-stage {
        position: relative;
        padding: 16px 18px;
        border-top: 1px solid var(--line);
        min-height: 76px;
        display: flex;
        align-items: center;
      }
      .bws-fact {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: -0.005em;
        color: var(--ink);
        transition: opacity .3s ease, transform .3s ease;
      }
      .bws-fact.fading {
        opacity: 0;
        transform: translateY(4px);
      }
      .bws-dots {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 8px 18px 12px;
        border-top: 1px solid var(--line);
      }
      .bws-dot {
        width: 8px; height: 8px;
        padding: 0;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--surface-2);
        cursor: pointer;
        transition: background .15s ease, transform .15s ease;
      }
      .bws-dot:hover { transform: scale(1.2); }
      .bws-dot[aria-current="true"] { background: #c1272d; border-color: #c1272d; }
      .bws-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* Skeleton loaders for any async card content */
      @keyframes skeleton-shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, var(--surface-2) 0%, var(--line) 50%, var(--surface-2) 100%);
        background-size: 800px 100%;
        animation: skeleton-shimmer 1.4s ease-in-out infinite;
        border-radius: 6px;
      }

      /* Sidebar tab pattern: focus-visible ring + smooth active transition */
      .nav button {
        transition: background .2s ease, color .2s ease, transform .15s ease;
      }
      .nav button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      [role="tabpanel"]:focus { outline: none; }
      [role="tabpanel"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: var(--radius); }

      /* Reduced-motion: disable all decorative animations site-wide */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* Headline strip, a single full-width ticker tab above the live
         FIFA card. Mirrors the live ticker's full-bleed feel with a
         distinct light surface so it reads as a separate cultural-
         context layer. */
      .headline-strip {
        display: block;
      }
      .headline-tab {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 18px 12px 22px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        column-gap: 18px;
        min-height: 56px;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        transition: box-shadow .2s ease;
      }
      .headline-tab:hover { box-shadow: var(--shadow-md); }
      .headline-tab::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent-color, var(--ink));
      }
      .headline-tab--bws { --accent-color: #c1272d; }

      .headline-tab .hl-label {
        font-family: var(--mono);
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.20em;
        text-transform: uppercase;
        color: var(--ink-3);
        display: flex; align-items: center; gap: 8px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .headline-tab .hl-label::before {
        content: "";
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--accent-color, var(--ink));
        box-shadow: 0 0 8px var(--accent-color, var(--ink));
      }
      .headline-tab .hl-text {
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
        line-height: 1.4;
        letter-spacing: -0.005em;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .headline-tab .hl-text.popping {
        animation: headline-fade .5s cubic-bezier(.2,.8,.2,1);
      }
      @keyframes headline-fade {
        0%   { opacity: 0; transform: translateY(4px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* KPI strip (legacy class, left in place for any future re-use) */
      .kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .kpi .label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kpi .value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
        font-feature-settings: "tnum" 1;
      }
      .kpi .sub {
        font-size: 11px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kpi .delta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 10.5px;
        color: var(--live);
        background: rgba(0,166,80,.08);
        padding: 2px 7px;
        border-radius: 999px;
      }
      .kpi.invert {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      .kpi.invert .label, .kpi.invert .sub { color: rgba(255,255,255,.65); }
      .kpi.invert .value { color: var(--white); }

      /* ─────────── LIVE FIFA section ─────────── */
      .live-card {
        background: var(--ink);
        color: var(--white);
        border: 1px solid var(--ink);
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
      }
      .live-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 200px at 0% 0%, rgba(0,166,80,.12), transparent 60%),
          radial-gradient(700px 220px at 100% 100%, rgba(29,78,216,.10), transparent 60%);
        pointer-events: none;
      }
      .live-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        row-gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,.08);
        position: relative;
      }
      .live-head .title {
        display: flex; align-items: center; gap: 10px;
        flex-wrap: wrap; row-gap: 4px;
        font-weight: 700; letter-spacing: -0.01em; font-size: 13px;
        min-width: 0;
      }
      .live-head .title .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--live);
        color: #fff;
        font-size: 10.5px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        padding: 3px 8px; border-radius: 999px;
      }
      .live-head .title .badge::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.6s ease-in-out infinite;
      }
      .live-head .meta {
        font-size: 11px;
        color: rgba(255,255,255,.6);
        font-family: var(--mono);
      }

      .ticker {
        position: relative;
        padding: 10px 0;
        overflow: hidden;
        direction: ltr; /* keep marquee flowing LTR even on RTL pages */
        mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
      }
      .ticker-track {
        display: inline-flex;
        align-items: center;
        gap: 28px;
        white-space: nowrap;
        animation: marquee 60s linear infinite;
        padding-left: 100%;
        direction: ltr;
      }
      .ticker-track:hover { animation-play-state: paused; }
      .ticker-item {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 12.5px;
        line-height: 1.2;
        color: rgba(255,255,255,.92);
        flex-shrink: 0;
      }
      .ticker-item .src {
        font-family: var(--mono);
        font-size: 10.5px;
        line-height: 1.2;
        color: rgba(255,255,255,.55);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-left: 2px solid rgba(255,255,255,.18);
        padding-left: 10px;
        align-self: center;
        flex-shrink: 0;
      }
      .ticker-item .sep {
        color: rgba(255,255,255,.24);
        align-self: center;
        line-height: 1.2;
      }
      .ticker-logo { vertical-align: middle; }

      /* Branded mark interleaved into the ticker */
      .ticker-item.with-logo { gap: 12px; }
      .ticker-item.with-logo .src { padding-left: 12px; }
      .ticker-logo {
        display: block;
        height: 28px;
        width: auto;
        max-width: 96px;
        object-fit: contain;
        flex: 0 0 auto;
        border-radius: 4px;
        background: #fff;
        padding: 2px 5px;
        box-shadow: 0 1px 2px rgba(0,0,0,.35);
      }

      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .live-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .live-cell {
        padding: 10px 14px;
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .live-cell:last-child { border-right: 0; }
      .live-cell .name {
        font-size: 11px;
        color: rgba(255,255,255,.55);
        font-weight: 600;
        letter-spacing: 0.04em;
        display: flex; align-items: center; gap: 6px;
      }
      .live-cell .name::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 8px var(--live-glow);
      }
      .live-cell.off .name::before { background: var(--ink-4); box-shadow: none; }
      .live-cell .v {
        font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em;
      }
      .live-cell .lat {
        font-family: var(--mono);
        font-size: 10.5px;
        color: rgba(255,255,255,.50);
      }

      /* Compact countdown shown inside the "Kickoff" KPI tile */
      .kpi.countdown-kpi .value {
        font-family: var(--mono);
        font-feature-settings: "tnum" 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        font-size: 22px;
      }
      .kpi.countdown-kpi .live-mark {
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--live);
        margin-right: 6px;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }

      /* Broadcast-style news panels inside the live FIFA card */
      .news-panel {
        padding: 10px 14px 9px;
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        overflow: hidden;
        height: 72px;
      }
      .news-panel:last-child { border-right: 0; }
      .news-panel::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent-color, var(--live));
      }
      .news-panel--fixtures { --accent-color: #ff3b30; }
      .news-panel--teams    { --accent-color: #f5b400; }
      .news-panel--facts    { --accent-color: #1d4ed8; }
      .news-panel--travel   { --accent-color: #00a650; }

      .news-label {
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
        display: flex; align-items: center; gap: 7px;
        flex: 0 0 auto;
      }
      .news-label::before {
        content: "";
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent-color, var(--live));
        box-shadow: 0 0 8px var(--accent-color, var(--live));
        animation: pulse 1.6s ease-in-out infinite;
      }

      .news-content {
        font-size: 11px;
        font-weight: 600;
        color: rgba(255,255,255,.96);
        line-height: 1.25;
        letter-spacing: -0.005em;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        word-break: break-word;
        overflow-wrap: anywhere;
      }
      .news-content.popping {
        animation: news-pop .55s cubic-bezier(.2,.8,.2,1);
      }

      @keyframes news-pop {
        0%   { opacity: 0; transform: translateY(10px); }
        60%  { opacity: 1; transform: translateY(-2px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* ─────────── Marathon Clothing view ─────────── */
      .marathon-hero {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1c 60%, #2a2a2e 100%);
        color: #fff;
        border-radius: var(--radius);
        border: 1px solid #1f1f24;
        padding: 22px 26px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      .marathon-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 220px at 0% 100%, rgba(0,166,80,.15), transparent 60%),
          radial-gradient(700px 220px at 100% 0%, rgba(245,180,0,.10), transparent 60%);
        pointer-events: none;
      }
      .marathon-hero .kicker {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,.65);
        margin-bottom: 10px;
        position: relative;
      }
      .marathon-hero blockquote {
        margin: 0;
        font-size: clamp(20px, 2.6vw, 32px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.18;
        color: #fff;
        position: relative;
        padding-left: 16px;
        border-left: 3px solid var(--live);
      }
      .marathon-hero cite {
        display: block;
        margin-top: 12px;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
      }

      /* Safety: human-trafficking resources grid */
      .resource-grid {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }
      .resource {
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-height: 110px;
      }
      .resource-title {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .resource-meta {
        font-size: 11.5px;
        color: var(--ink-3);
        line-height: 1.35;
      }
      .resource-actions {
        margin-top: auto;
        padding-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 8px;
      }
      .resource-link {
        font-size: 12px;
        font-weight: 600;
        color: var(--ink);
        text-decoration: none;
        padding: 4px 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--white);
        transition: background .15s ease, border-color .15s ease;
        white-space: nowrap;
      }
      .resource-link:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
      .resource-link strong { font-weight: 700; }
      @media (max-width: 720px) {
        .resource-grid { grid-template-columns: 1fr; }
        .resource-link { white-space: normal; }
      }

      /* Compact Branding hero override */
      .branding-hero { padding: 18px 22px; }
      .branding-hero blockquote { font-size: clamp(18px, 2.2vw, 26px); }
      .branding-hero cite {
        display: inline-block;
        margin-top: 10px;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: none;
        color: rgba(255,255,255,.86);
        min-height: 1.4em;
      }
      .branding-hero cite.popping {
        animation: news-pop .55s cubic-bezier(.2,.8,.2,1);
      }

      /* Branding side-by-side pillars */
      .branding-pillars { gap: 12px; }
      .branding-pillars .card { transition: transform .15s ease, box-shadow .2s ease, border-color .15s ease; }
      .branding-pillars .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); border-color: var(--line-2); }

      /* Bottom strip: lanes + CTA in one row */
      .branding-bottom-body {
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .branding-lanes {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
      }
      .lane {
        position: relative;
        padding: 10px 12px 10px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        min-height: 58px;
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .lane:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
      .lane::before {
        content: ""; position: absolute; left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent-color, var(--ink));
      }
      .lane--spotlight { --accent-color: #ff3b30; }
      .lane--movement  { --accent-color: #f5b400; }
      .lane--legacy    { --accent-color: #00a650; }
      .lane strong { font-size: 13px; letter-spacing: -0.01em; color: var(--ink); }
      .lane span { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
      .branding-cta-row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
        padding-top: 4px;
        border-top: 1px solid var(--line);
      }
      .branding-cta-row .btn { padding-top: 4px; }
      /* Equal-height pillar cards on the Branding tab */
      .branding-pillars { align-items: stretch; }
      .branding-pillars .card { display: flex; flex-direction: column; }
      .branding-pillars .card-body { flex: 1 1 auto; }

      @media (max-width: 980px) {
        .branding-pillars { grid-template-columns: 1fr; }
        .branding-lanes { grid-template-columns: 1fr; }
      }

      .marathon-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
        gap: 12px;
      }
      .marathon-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .nipsey-hero {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1c 60%, #2a2a2e 100%);
      }
      .nipsey-hero img {
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }
      /* Translate tab, flag-card language picker */
      .lang-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .lang-card {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        text-align: left;
        cursor: pointer;
        font: inherit;
        color: inherit;
        transition: transform .15s ease, box-shadow .2s ease, border-color .15s ease, background .15s ease;
      }
      .lang-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
        border-color: var(--line-2);
      }
      .lang-card.active {
        border-color: var(--ink);
        background: var(--surface-2);
      }
      .lang-flag { font-size: 22px; line-height: 1; flex: 0 0 auto; }
      .lang-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
      .lang-native {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
        line-height: 1.18;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lang-en {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .lang-mark {
        color: var(--live);
        font-size: 14px;
        line-height: 1;
        flex: 0 0 auto;
      }

      .video-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: var(--radius-sm);
        overflow: hidden;
      }
      .video-frame iframe,
      .video-frame video {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        border: 0;
        object-fit: contain;
        background: #000;
      }

      .quote-rotator {
        position: relative;
        min-height: 78px;
      }
      .quote-rotator blockquote {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.32;
        letter-spacing: -0.01em;
        color: var(--ink);
        padding-left: 12px;
        border-left: 3px solid var(--live);
      }
      .quote-rotator.popping blockquote {
        animation: news-pop .55s cubic-bezier(.2,.8,.2,1);
      }

      @media (max-width: 980px) {
        .marathon-grid { grid-template-columns: 1fr; }
      }

      /* Suppress every translation-engine UI artifact so no third-party
         branding, toolbar, banner, balloon, tooltip, spinner, or
         attribution leaks into the dashboard. The translation itself
         still applies to the page text. */
      [class*="goog-te-spinner"],
      [class*="goog-te-banner"],
      [class*="goog-te-balloon"],
      [class*="goog-te-menu-frame"],
      [class*="goog-te-ftab"],
      [id*="goog-gt-tt"],
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      .goog-te-balloon-frame,
      .goog-te-menu-frame,
      .goog-te-spinner,
      .goog-te-spinner-pos,
      .goog-te-spinner-frame,
      .goog-te-spinner-anim,
      iframe.goog-te-spinner-frame,
      iframe.goog-te-banner-frame,
      iframe.goog-te-menu-frame,
      .goog-te-ftab,
      iframe.skiptranslate,
      iframe[id^="goog-gt-"],
      iframe[name="googtrans"],
      iframe[src*="translate.google"],
      iframe[src*="translate.googleapis"],
      .skiptranslate iframe {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: fixed !important;
        top: -9999px !important;
        left: -9999px !important;
      }
      .goog-te-gadget,
      .goog-logo-link,
      .goog-te-gadget-icon,
      .goog-te-gadget span,
      .goog-te-gadget a { display: none !important; visibility: hidden !important; height: 0 !important; }
      .goog-tooltip,
      .goog-tooltip:hover,
      .goog-tooltip-popup { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
      /* Lock the body so no Google rule can shove it down for an
         invisible toolbar, anywhere on the page. */
      body { top: 0 !important; position: static !important; margin-top: 0 !important; }
      html { margin-top: 0 !important; }
      /* Last line of defence, strip anything anchored directly into
         <body> by the engine. */
      body > .skiptranslate { display: none !important; }

      /* Map */
      .map-wrap { flex: 1; min-height: 0; position: relative; }
      .map { position: absolute; inset: 0; background: #eef0f2; }
      .leaflet-container { font-family: var(--font); background: #eef0f2; }
      .leaflet-control-attribution { font-size: 9px; color: var(--ink-3); }
      .host-marker {
        display: block;
        width: 12px; height: 12px;
        border: 2px solid var(--ink);
        border-radius: 999px;
        background: var(--white);
        box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 1px 4px rgba(0,0,0,.25);
        transition: transform .15s ease;
      }
      .host-marker.active {
        width: 16px; height: 16px;
        background: var(--ink);
        box-shadow: 0 0 0 4px rgba(0,166,80,.22), 0 1px 6px rgba(0,0,0,.3);
      }

      .map-legend {
        position: absolute;
        left: 12px; bottom: 12px;
        background: rgba(255,255,255,.95);
        backdrop-filter: blur(8px);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 11px;
        color: var(--ink-2);
        display: flex; align-items: center; gap: 12px;
        box-shadow: var(--shadow-sm);
        z-index: 400;
      }
      .map-legend span { display: inline-flex; align-items: center; gap: 6px; }
      .map-legend i {
        width: 10px; height: 10px; border-radius: 50%;
        background: var(--white); border: 2px solid var(--ink);
      }
      .map-legend i.sel { background: var(--ink); }

      /* Right rail in overview */
      .rail-stack {
        display: grid;
        gap: 10px;
        grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
        min-height: 0;
      }
      .list { display: flex; flex-direction: column; gap: 0; }
      .list-row {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .list-row:last-child { border-bottom: 0; }
      .list-row .lbl { color: var(--ink-2); font-weight: 500; }
      .list-row .val { color: var(--ink); font-weight: 700; font-feature-settings: "tnum" 1; }

      .bar-row {
        display: grid;
        grid-template-columns: 88px 1fr 44px;
        gap: 10px;
        align-items: center;
        font-size: 11.5px;
        color: var(--ink-2);
        padding: 6px 0;
      }
      .bar-row .lbl { font-weight: 600; color: var(--ink); }
      .bar-row .val { text-align: right; font-weight: 700; font-family: var(--mono); font-size: 11px; color: var(--ink); }
      .track {
        height: 5px;
        background: var(--surface-2);
        border-radius: 999px;
        overflow: hidden;
      }
      .track span {
        display: block; width: var(--w);
        height: 100%; background: var(--ink);
        border-radius: 999px;
      }

      /* Tables */
      .table-wrap { overflow: auto; height: 100%; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      thead th {
        position: sticky; top: 0;
        background: var(--surface);
        font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase;
        color: var(--ink-3);
        font-weight: 700;
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
      }
      tbody td {
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
        color: var(--ink-2);
      }
      tbody tr:hover td { background: var(--surface-2); }
      tbody td strong { color: var(--ink); font-weight: 700; }

      /* Pills */
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        font-size: 10.5px; font-weight: 700;
        letter-spacing: 0.06em; text-transform: uppercase;
        color: var(--ink-2);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 8px;
      }
      .pill.ok { color: #057a37; background: rgba(0,166,80,.10); border-color: rgba(0,166,80,.22); }
      .pill.warn { color: #92400e; background: rgba(217,119,6,.10); border-color: rgba(217,119,6,.22); }
      .pill.dot::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: currentColor;
      }

      /* Generic two-col / three-col grids for sub-views */
      .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }

      /* Venue cards (Host-Map / Venues view) */
      .venue-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 10px;
      }
      .venue-card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: 14px 14px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        transition: transform .15s ease, box-shadow .2s ease, border-color .15s ease;

      .venue-card:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
        border-color: var(--line-2);
      }
      .venue-card .country {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .venue-card .city {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--ink);
        line-height: 1.18;
      }
      .venue-card .venue {
        font-size: 12px;
        color: var(--ink-2);
        font-weight: 500;
        line-height: 1.35;
      }
      .venue-card .cap {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .venue-card .cap .cap-lbl {
        font-family: var(--font);
        font-weight: 600;
        font-size: 10px;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }

      /* Pogba Academy hero strip, 6 picture tiles in place of the KPI strip.
         Captions stripped per request; the program cards below already label
         the offerings, so the tiles read as a clean photo wall. */
      .pogba-strip {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
        align-items: stretch;
      }
      .pogba-tile {
        position: relative;
        aspect-ratio: 4 / 3;
        max-height: 200px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a1c 0%, #3f3f46 100%);
        box-shadow: var(--shadow-sm);
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .pogba-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .pogba-tile img {
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }
      @media (max-width: 1100px) {
        .pogba-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .pogba-tile { aspect-ratio: 16 / 10; max-height: 180px; }
      }
      @media (max-width: 560px) {
        .pogba-strip { grid-template-columns: 1fr 1fr; gap: 8px; }
        .pogba-tile { aspect-ratio: 5 / 3; max-height: 140px; }
      }

      .lede {
        font-size: 12.5px;
        color: var(--ink-2);
        margin: 0;
      }
      .lede strong { color: var(--ink); }

      /* Modal */
      .modal {
        position: fixed; inset: 0;
        background: rgba(10,10,10,.45);
        display: none; align-items: center; justify-content: center;
        z-index: 1000;
        padding: 18px;
        backdrop-filter: blur(2px);
      }
      .modal.open { display: flex; }
      .modal-card {
        width: min(560px, 100%);
        background: var(--surface);
        border-radius: var(--radius);
        border: 1px solid var(--line);
        box-shadow: var(--shadow-lg);
        overflow: hidden;
      }

      /* Compact venue card (map-click modal). Layout/styling cue
         was BulleCloud's information cards: dense header, hero
         image strip, then a tight key-value grid. Data is ours. */
      .venue-card-modal {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .vcm-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .vcm-flag {
        font-size: 28px;
        line-height: 1;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--surface-2, #f4f4f6);
        border: 1px solid var(--line);
        flex: 0 0 auto;
      }
      .vcm-title {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
        flex: 1 1 auto;
      }
      .vcm-venue {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        letter-spacing: -0.01em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .vcm-loc {
        font-size: 12px;
        color: var(--ink-3);
        font-family: var(--mono);
        letter-spacing: 0.04em;
      }
      .vcm-iso {
        margin-left: 4px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ink);
        color: var(--white);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      .vcm-aerial-figure {
        margin: 2px auto 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .vcm-aerial {
        position: relative;
        width: 100%;
        max-width: 240px;
        aspect-ratio: 7 / 6;
        border-radius: 14px;
        overflow: hidden;
        background: transparent;
        box-shadow: 0 8px 22px rgba(15, 18, 24, 0.18), 0 1px 3px rgba(15, 18, 24, 0.08);
      }
      .vcm-aerial img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .vcm-aerial-cap {
        text-align: center;
        font-size: 9px;
        font-family: var(--mono);
        color: var(--ink-3);
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .vcm-stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px 14px;
        margin: 0;
      }
      .vcm-stats > div {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        background: var(--surface-2, #f6f7f8);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .vcm-stats dt {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .vcm-stats dd {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .vcm-stats dd.mono {
        font-family: var(--mono);
        font-weight: 500;
        font-size: 12px;
      }
      .vcm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }

      .lang-iso {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--ink);
        color: var(--white);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-family: var(--mono);
        vertical-align: 1px;
      }

      /* Toast */
      .toast {
        position: fixed; bottom: 18px; left: 50%;
        transform: translate(-50%, 20px);
        background: var(--ink); color: var(--white);
        padding: 9px 14px;
        border-radius: 999px;
        font-size: 12px; font-weight: 600;
        opacity: 0; pointer-events: none;
        transition: opacity .2s ease, transform .25s ease;
        z-index: 2000;
        box-shadow: var(--shadow-lg);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      /* Mobile menu trigger */
      .menu-btn { display: none; }

      /* ─────────── Responsive ─────────── */
      /* iPad-landscape and small laptops */
      @media (max-width: 1280px) {
        :root { --rail: 208px; }
        .kpi .value { font-size: 22px; }
        .headline-tab .hl-text { font-size: 12.5px; }
        .pogba-tile { max-height: 180px; }
      }

      @media (max-width: 1100px) {
        #overview.section.active {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto auto minmax(220px, 1fr) minmax(220px, auto);
          grid-template-areas:
            "kpi"
            "live"
            "map"
            "rail";
        }
        .live-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .live-cell:nth-child(2) { border-right: 0; }
        .ticker-logo { height: 24px; max-width: 84px; }
        .kpi.countdown-kpi .value { font-size: 19px; }
      }

      @media (max-width: 980px) {
        body { overflow: auto; }
        .app {
          grid-template-columns: 1fr;
          height: auto;
          min-height: 100vh;
        }
        .rail {
          position: static;
          height: auto;
          align-self: auto;
          overflow: visible;
          z-index: 20;
          grid-template-rows: auto auto auto;
          background: rgba(255,255,255,.92);
          backdrop-filter: blur(12px);
          border-right: 0;
          border-bottom: 1px solid var(--line);
        }
        .brand { padding: 14px 16px 8px; flex-direction: row; justify-content: space-between; align-items: center; width: 100%; }
        .brand img { width: 132px; }
        .menu-btn { display: none !important; }
        .nav {
          display: flex;
          flex-direction: row;
          overflow-x: auto;
          padding: 4px 12px 12px;
          gap: 6px;
          scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav button {
          display: inline-flex;
          width: auto;
          flex: 0 0 auto;
          grid-template-columns: none;
          padding: 8px 12px;
          gap: 8px;
        }
        .nav .kbd { display: none; }
        .rail-foot { display: none; }
        .topbar {
          padding: 12px 16px;
          height: auto;
          flex-wrap: wrap;
          row-gap: 8px;
        }
        .top-actions { flex-wrap: wrap; row-gap: 6px; }
        .top-actions .select { min-height: 36px; }  /* keep language picker reachable on touch */
        .top-actions .btn { min-height: 36px; padding: 0 14px; }
        .nav button { min-height: 38px; }  /* touch-friendly tab targets */
        .view { padding: 12px 14px 18px; }
        #overview.section.active {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas: "kpi" "live" "map" "rail";
          grid-template-rows: auto auto 320px auto;
        }
        .grid-map, .grid-rail { min-height: 0; }
        .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-2, .grid-3 { grid-template-columns: 1fr; }
        .card-body { max-height: none; }
        .table-wrap { max-height: 60vh; }
        .lang-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
        .marathon-grid { grid-template-columns: 1fr; }
        .pogba-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }

      @media (max-width: 560px) {
        .kpis { grid-template-columns: 1fr 1fr; gap: 8px; }
        .headline-tab {
          grid-template-columns: 1fr;
          column-gap: 0;
          row-gap: 4px;
          padding: 10px 14px 10px 18px;
          min-height: 0;
        }
        .headline-tab .hl-text { font-size: 12px; white-space: normal; line-height: 1.3; }
        .kpi .value { font-size: 20px; }
        .live-grid { grid-template-columns: 1fr 1fr; }
        .topbar h2 { font-size: 14px; }
        .ticker-logo { height: 20px; max-width: 72px; padding: 1px 4px; }
        .ticker-item.with-logo { gap: 10px; }
        .kpi.countdown-kpi .value { font-size: 17px; }
        .lang-grid { grid-template-columns: 1fr; gap: 8px; }
        .lang-card { padding: 11px 12px; }
        .lang-flag { font-size: 20px; }
        .lang-native { font-size: 13px; }
        .marathon-hero { padding: 16px 18px; }
        .marathon-hero blockquote { font-size: 18px; padding-left: 12px; }
        .news-panel { height: auto; min-height: 78px; }
      }

      /* Tablet-portrait + large phones */
      @media (max-width: 720px) {
        .marathon-grid { grid-template-columns: 1fr; }
        .pogba-strip { grid-template-columns: 1fr 1fr; }
        .news-panel { padding: 9px 12px 8px; }
        .marathon-hero blockquote { font-size: 20px; }
      }

      /* Small phones */
      @media (max-width: 420px) {
        .brand img { width: 116px; }
        .topbar h2 { font-size: 13px; }
        .topbar .crumb { font-size: 11px; }
        .topbar > div:first-child { width: 100%; }   /* title gets its own row */
        .top-actions { width: 100%; }                /* actions wrap as a strip */
        .top-actions .btn, .top-actions .select { flex: 1 1 auto; }
        .marathon-hero { padding: 14px 16px; }
        .marathon-hero blockquote { font-size: 17px; }
        .pogba-strip { grid-template-columns: 1fr; }
        .pogba-tile { aspect-ratio: 16 / 9; max-height: 200px; }
        .news-panel { min-height: 70px; }
      }

      /* Touch-and-tap niceties wherever the device is touch-capable. */
      @media (hover: none) {
        .btn, .nav button, .lang-card, .venue-card, .pogba-tile, .drop-tile {
          -webkit-tap-highlight-color: rgba(0,0,0,0.06);
        }
        .btn:hover, .lang-card:hover, .venue-card:hover, .pogba-tile:hover {
          transform: none;  /* no hover lift on touch where it would feel laggy */
        }
      }

      /* Print */
      @media print {
        .rail, .topbar { display: none; }
        body { overflow: visible; }
        .app { display: block; height: auto; }
        .view { padding: 0; overflow: visible; }
      }

      function startBwsRotator() {
        const card = document.getElementById("bwsCard");

        if (!card || !stage) return;
        bwsState.i = 0;

        if (bwsState.observer) { try { bwsState.observer.disconnect(); } catch {} bwsState.observer = null; }

          renderFact(bwsState.i);
        };
        const goTo = (idx) => {
          bwsState.i = idx % BWS_FACTS.length;
          renderFact(bwsState.i);
        };
        const startTimer = () => {
          if (bwsState.timer) clearInterval(bwsState.timer);
          bwsState.timer = setInterval(() => {
            if (!bwsState.paused) advance(1);

      // KPI count-up animation (runs after render)
      function animateCountUps(root = document) {
        root.querySelectorAll(".kpi .value[data-count]").forEach((el) => {
          if (el.dataset.animated === "1") return;
          el.dataset.animated = "1";
          const target = parseFloat(el.dataset.count);
          const suffix = el.dataset.suffix || "";
          if (!isFinite(target)) return;
          const orig = el.textContent;
          const duration = 700;
          const start = performance.now();
          const decimals = (String(target).split(".")[1] || "").length;
          function tick(now) {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const v = (target * eased).toFixed(decimals);
            el.textContent = (decimals > 0 ? v : Math.round(target * eased)) + suffix;
            if (t < 1) requestAnimationFrame(tick); else el.textContent = orig;
          }
          requestAnimationFrame(tick);
        });
      }

      // Mexico City sits on CST (UTC-6) year-round (DST abolished there in 2022),
      // so 12:00 CDMX = 18:00 UTC.
      const KICKOFF_UTC = Date.UTC(2026, 5, 11, 18, 0, 0);
      // Final: MetLife Stadium (NY/NJ), Jul 19, 2026, 15:00 ET = 19:00 UTC.
      const FINAL_UTC   = Date.UTC(2026, 6, 19, 19, 0, 0);

      function pad2(n) { return String(n).padStart(2, "0"); }

      function updateCountdown() {
        const valEl = document.getElementById("cdValue");
        const subEl = document.getElementById("cdSub");
        if (!valEl) return;
        const now = Date.now();
        const toKick = KICKOFF_UTC - now;
        if (toKick > 0) {
          const d = Math.floor(toKick / 86400000);
          const h = Math.floor((toKick % 86400000) / 3600000);
          const m = Math.floor((toKick % 3600000) / 60000);
          const s = Math.floor((toKick % 60000) / 1000);
          valEl.innerHTML = `<span class="live-mark"></span>${d}d ${pad2(h)}:${pad2(m)}:${pad2(s)}`;
          if (subEl) subEl.textContent = "Kickoff · Jun 11, 2026 · CDMX";
          return;
        }
        const toFinal = FINAL_UTC - now;
        if (toFinal > 0) {
          const dayInto = Math.floor((now - KICKOFF_UTC) / 86400000) + 1;
          const dToFinal = Math.ceil(toFinal / 86400000);
          valEl.innerHTML = `<span class="live-mark"></span>Day ${dayInto}/39`;
          if (subEl) subEl.textContent = `Tournament live · ${dToFinal}d to Final`;
          return;
        }
        const daysSince = Math.floor((now - FINAL_UTC) / 86400000);
        valEl.textContent = "Concluded";
        if (subEl) subEl.textContent = `${daysSince}d since the Final · Jul 19`;
      }

      function ensureVideoPlays() {
        const video = document.querySelector(".nip-video");
        if (!video) return;
        const tryPlay = () => {
          const p = video.play();
          if (p && typeof p.catch === "function") {
            p.catch(() => {
              // Browser blocked autoplay, wait for any user gesture
              // anywhere on the page, then try again.
              const wake = () => {
                video.play().catch(() => {});
                document.removeEventListener("click", wake);
                document.removeEventListener("keydown", wake);
                document.removeEventListener("touchstart", wake);
              };
              document.addEventListener("click", wake, { once: true });
              document.addEventListener("keydown", wake, { once: true });
              document.addEventListener("touchstart", wake, { once: true });

      let liveApiAvailable = true;

      async function refreshLive() {
        if (!liveApiAvailable) return;
        state.live = "checking";
        state.grantLive = "checking";
        renderActive();
        try {
          const [live, grant] = await Promise.allSettled([
            fetch("/api/live-feeds"),
            fetch("/api/grant-feeds")

          if (live.status === "fulfilled" && live.value.ok) {
            const payload = await live.value.json();
            state.live = "connected";
            state.liveSources = payload.sources || [];
            state.liveItems = payload.items || [];
            state.generatedAt = payload.generatedAt || null;
          } else {
            state.live = "unavailable";

          state.live = "unavailable";
          state.grantLive = "unavailable";

      // than dispatching a fake change event into Google's hidden combo.
      function readGoogtrans() {
        // Match codes like "es", "fr", "ar", "ti", "so", "zh-TW", "tl"…
        const m = document.cookie.match(/(?:^|;\s*)googtrans=\/[A-Za-z-]+\/([A-Za-z-]+)/);

      function retranslateIfNeeded() {

        const tick = () => {

          if (goog) {
            if (goog.value !== lang) goog.value = lang;
            goog.dispatchEvent(new Event("change"));
            return;

          if (++attempts < 30) setTimeout(tick, 200);
        };

      }
      function setGoogtrans(lang) {
        const host = location.hostname;
        const expires = new Date(Date.now() + 365 * 24 * 3600 * 1000).toUTCString();
        const clear = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/; SameSite=Lax;";
        // Clear any existing cookie on both / and .domain so we start clean
        document.cookie = clear;
        if (host && host !== "localhost") {
          document.cookie = clear + " domain=" + host + ";";
          document.cookie = clear + " domain=." + host + ";";
        }
        if (lang && lang !== "en") {
          const value = "googtrans=/en/" + lang + "; expires=" + expires + "; path=/; SameSite=Lax;";
          document.cookie = value;
          if (host && host !== "localhost") {
            document.cookie = value + " domain=" + host + ";";
            document.cookie = value + " domain=." + host + ";";
          }
        }
      }
      function setPageLanguage(lang) {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        // Set the cookie so future page loads also stay translated, then
        // try to flip the language IN PLACE, no reload, no browser tab
        // spinner. Polls briefly for the translation engine's hidden
        // combo to be present, then dispatches a change.
        setGoogtrans(lang);
        let attempts = 0;
        const trySet = () => {
          const goog = document.querySelector(".goog-te-combo");
          if (goog) {
            goog.value = lang;
            goog.dispatchEvent(new Event("change"));
            return;
          }
          if (++attempts < 40) { setTimeout(trySet, 150); return; }
          // Engine never showed up (script blocked / very slow network)
          //, fall back to a reload so the cookie still takes effect.
          location.reload();
        };
        trySet();
      }

      $("#languageSelect").addEventListener("change", (e) => {
        // No toast, page reload speaks for itself; the brand area
        // shouldn't flash a status indicator on language change.
        setPageLanguage(e.target.value);
      });
      $("#closeModal").addEventListener("click", () => $("#modal").classList.remove("open"));
      $("#menuBtn")?.addEventListener("click", () => {
        document.querySelector(".nav").scrollIntoView({ behavior: "smooth" });
      });

      // Init, restore the active view from #hash so refreshes,
      // shareable links, and back/forward all land where the user expects.
      const initialView = viewFromHash();
      if (initialView) state.view = initialView;
      // Sync the language picker to whatever Google Translate is showing
      // (read from the googtrans cookie). Keeps the dropdown honest after
      // a reload triggered by setPageLanguage.
      const initialLang = readGoogtrans();
      const langSel = $("#languageSelect");
      if (langSel && [...langSel.options].some(o => o.value === initialLang)) {
        langSel.value = initialLang;
        document.documentElement.lang = initialLang;
        document.documentElement.dir = initialLang === "ar" ? "rtl" : "ltr";
      }
      renderActive();
      refreshLive();
      // Only schedule the auto-refresh; refreshLive() will clear it
      // automatically the first time the /api/* endpoints fail.
      liveAutoRefreshTimer = setInterval(refreshLive, 5 * 60 * 1000);
      // Tick the FIFA 2026 countdown every second
      setInterval(updateCountdown, 1000);

      // Leaflet is loaded with defer so it can race with the first
      // renderActive(). When the window finishes loading (Leaflet is
      // guaranteed available by then), re-init any visible map and
      // re-trigger any pending translation pass.
      window.addEventListener("load", () => {
        if (window.L) initVisibleMaps();
        retranslateIfNeeded();
      });
    </script>
  </body>
</html>
