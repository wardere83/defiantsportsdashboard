<!doctype html> 
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Defiant Sports — World Cup 2026 Operations</title>
    <meta
      name="description"
      content="Defiant Sports operations intelligence for FIFA World Cup 2026: live fixtures, host-city stewardship, grants, transportation, safety, and cultural programming."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root {
        --bg: #fafafa;
        --surface: #ffffff;
        --surface-2: #f4f4f5;
        --ink: #0a0a0a;
        --ink-2: #3f3f46;
        --ink-3: #71717a;
        --ink-4: #a1a1aa;
        --line: #e4e4e7;
        --line-2: #d4d4d8;
        --black: #0a0a0a;
        --white: #ffffff;
        --live: #00a650;
        --live-glow: rgba(0, 166, 80, 0.18);
        --warn: #d97706;
        --accent: #1d4ed8;
        --rail: 232px;
        --topbar: 64px;
        --radius: 14px;
        --radius-sm: 10px;
        --shadow-sm: 0 1px 2px rgba(10, 10, 10, 0.04);
        --shadow-md: 0 4px 16px rgba(10, 10, 10, 0.06);
        --shadow-lg: 0 14px 44px rgba(10, 10, 10, 0.10);
        --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 13px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        overflow-y: auto;
      }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; }
      a { color: inherit; text-decoration: none; }

      /* ─────────── Layout shell ─────────── */
      .app {
        display: grid;
        grid-template-columns: var(--rail) minmax(0, 1fr);
        min-height: 100vh;
        min-height: 100dvh;
      }

      .rail {
        position: sticky;
        top: 0;
        align-self: start;
        height: 100vh;
        height: 100dvh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        background: var(--white);
        border-right: 1px solid var(--line);
        min-width: 0;
        overflow: hidden;
      }

      .brand {
        padding: 22px 20px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }
      .brand img {
        width: 168px;
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: 8px;
      }

      .nav {
        padding: 6px 10px 10px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow-y: auto;
      }
      .nav button {
        display: grid;
        grid-template-columns: 22px 1fr auto;
        align-items: center;
        gap: 10px;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--ink-2);
        padding: 8px 10px;
        border-radius: 8px;
        font-weight: 550;
        font-size: 12.5px;
        letter-spacing: -0.005em;
        transition: background .15s ease, color .15s ease, transform .15s ease;
      }
      .nav button:hover { background: var(--surface-2); color: var(--ink); }
      .nav button.active {
        background: var(--ink);
        color: var(--white);
        box-shadow: var(--shadow-sm);
      }
      .nav .glyph {
        display: grid;
        place-items: center;
        font-size: 13px;
        opacity: .8;
      }
      .nav button.active .glyph { opacity: 1; }
      .nav .kbd {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-4);
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 1px 5px;
      }
      .nav button.active .kbd {
        background: rgba(255,255,255,.10);
        border-color: rgba(255,255,255,.18);
        color: rgba(255,255,255,.9);
      }

      .rail-foot {
        border-top: 1px solid var(--line);
        padding: 12px 20px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 11px;
        color: var(--ink-3);
      }
      .rail-foot a { font-weight: 600; color: var(--ink); }
      .rail-foot .ping {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--ink-4);
        box-shadow: 0 0 0 0 rgba(0,0,0,0);
      }
      .rail-foot .ping.live {
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { box-shadow: 0 0 0 0 var(--live-glow); }
        50% { box-shadow: 0 0 0 8px transparent; }
      }

      /* ─────────── Top bar ─────────── */
      .content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        background: var(--bg);
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 30;
        height: var(--topbar);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 22px;
        border-bottom: 1px solid var(--line);
        background: rgba(255,255,255,.85);
        backdrop-filter: saturate(180%) blur(14px);
        -webkit-backdrop-filter: saturate(180%) blur(14px);
      }
      .topbar h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .topbar .crumb {
        font-size: 11.5px;
        color: var(--ink-3);
        margin-top: 1px;
        letter-spacing: 0.02em;
      }
      .top-actions { display: flex; align-items: center; gap: 8px; }

      .live-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 11px;
        border-radius: 999px;
        background: var(--ink);
        color: var(--white);
        font-weight: 600;
        font-size: 11.5px;
        letter-spacing: 0.02em;
        box-shadow: var(--shadow-sm);
      }
      .live-chip .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--live);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .live-chip.off { background: var(--surface); color: var(--ink-3); border: 1px solid var(--line); }
      .live-chip.off .dot { background: var(--ink-4); animation: none; }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        transition: background .15s ease, border-color .15s ease, transform .12s ease;
      }
      .btn:hover { background: var(--surface-2); }
      .btn:active { transform: translateY(1px); }
      .btn.dark { background: var(--ink); color: var(--white); border-color: var(--ink); }
      .btn.dark:hover { background: #1a1a1a; }
      .btn.icon { width: 32px; padding: 0; }

      .select {
        height: 32px;
        padding: 0 28px 0 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--white) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' stroke='%2371717a' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 9px center;
        font-size: 12px;
        appearance: none;
        -webkit-appearance: none;
      }

      /* ─────────── Main view ─────────── */
      .view {
        min-width: 0;
        padding: 14px 18px 24px;
      }
      .section { display: none; min-width: 0; }
      .section.active { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
      .section .fill { min-width: 0; }

      /* Overview = master grid; rows size to content but the map area gets a sensible min-height */
      #overview.section.active {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "kpi    kpi"
          "live   live"
          "map    rail";
        gap: 12px;
      }
      .grid-map { min-height: 480px; }
      .grid-rail { min-height: 480px; }

      .grid-kpi { grid-area: kpi; }
      .grid-live { grid-area: live; }
      .grid-map { grid-area: map; min-height: 0; }
      .grid-rail { grid-area: rail; min-height: 0; }

      /* ─────────── Cards ─────────── */
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        row-gap: 4px;
        padding: 11px 14px;
        border-bottom: 1px solid var(--line);
      }
      .card-head h3 {
        margin: 0;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-2);
        min-width: 0;
      }
      .card-head .meta {
        font-size: 11px;
        color: var(--ink-3);
        letter-spacing: 0.02em;
        min-width: 0;
      }
      .card-body {
        padding: 12px 14px;
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .card-body.flush { padding: 0; }

      /* KPI strip */
      .kpis {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }
      .kpi {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        box-shadow: var(--shadow-sm);
        position: relative;
        overflow: hidden;
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .kpi .label {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.10em;
        text-transform: uppercase;
        color: var(--ink-3);
      }
      .kpi .value {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.04em;
        color: var(--ink);
        font-feature-settings: "tnum" 1;
      }
      .kpi .sub {
        font-size: 11px;
        color: var(--ink-3);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .kpi .delta {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-weight: 700;
        font-size: 10.5px;
        color: var(--live);
        background: rgba(0,166,80,.08);
        padding: 2px 7px;
        border-radius: 999px;
      }
      .kpi.invert {
        background: var(--ink);
        color: var(--white);
        border-color: var(--ink);
      }
      .kpi.invert .label, .kpi.invert .sub { color: rgba(255,255,255,.65); }
      .kpi.invert .value { color: var(--white); }

      /* ─────────── LIVE FIFA section ─────────── */
      .live-card {
        background: var(--ink);
        color: var(--white);
        border: 1px solid var(--ink);
        border-radius: var(--radius);
        overflow: hidden;
        position: relative;
      }
      .live-card::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 200px at 0% 0%, rgba(0,166,80,.12), transparent 60%),
          radial-gradient(700px 220px at 100% 100%, rgba(29,78,216,.10), transparent 60%);
        pointer-events: none;
      }
      .live-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        row-gap: 6px;
        padding: 10px 14px;
        border-bottom: 1px solid rgba(255,255,255,.08);
        position: relative;
      }
      .live-head .title {
        display: flex; align-items: center; gap: 10px;
        flex-wrap: wrap; row-gap: 4px;
        font-weight: 700; letter-spacing: -0.01em; font-size: 13px;
        min-width: 0;
      }
      .live-head .title .badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--live);
        color: #fff;
        font-size: 10.5px; font-weight: 800;
        letter-spacing: 0.12em; text-transform: uppercase;
        padding: 3px 8px; border-radius: 999px;
      }
      .live-head .title .badge::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: #fff; animation: pulse 1.6s ease-in-out infinite;
      }
      .live-head .meta {
        font-size: 11px;
        color: rgba(255,255,255,.6);
        font-family: var(--mono);
      }

      .ticker {
        position: relative;
        padding: 10px 0;
        overflow: hidden;
        mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
      }
      .ticker-track {
        display: inline-flex;
        gap: 28px;
        white-space: nowrap;
        animation: marquee 60s linear infinite;
        padding-left: 100%;
      }
      .ticker-track:hover { animation-play-state: paused; }
      .ticker-item {
        display: inline-flex; align-items: center; gap: 10px;
        font-size: 12.5px;
        color: rgba(255,255,255,.92);
      }
      .ticker-item .src {
        font-family: var(--mono);
        font-size: 10.5px;
        color: rgba(255,255,255,.55);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        border-left: 2px solid rgba(255,255,255,.18);
        padding-left: 10px;
      }
      .ticker-item .sep { color: rgba(255,255,255,.24); }

      /* Branded mark interleaved into the ticker */
      .ticker-item.with-logo { gap: 12px; }
      .ticker-item.with-logo .src { padding-left: 12px; }
      .ticker-logo {
        display: block;
        height: 28px;
        width: auto;
        max-width: 96px;
        object-fit: contain;
        flex: 0 0 auto;
        border-radius: 4px;
        background: #fff;
        padding: 2px 5px;
        box-shadow: 0 1px 2px rgba(0,0,0,.35);
      }

      @keyframes marquee {
        from { transform: translateX(0); }
        to { transform: translateX(-50%); }
      }

      .live-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 0;
        border-top: 1px solid rgba(255,255,255,.08);
      }
      .live-cell {
        padding: 10px 14px;
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .live-cell:last-child { border-right: 0; }
      .live-cell .name {
        font-size: 11px;
        color: rgba(255,255,255,.55);
        font-weight: 600;
        letter-spacing: 0.04em;
        display: flex; align-items: center; gap: 6px;
      }
      .live-cell .name::before {
        content: ""; width: 6px; height: 6px; border-radius: 50%;
        background: var(--live);
        box-shadow: 0 0 8px var(--live-glow);
      }
      .live-cell.off .name::before { background: var(--ink-4); box-shadow: none; }
      .live-cell .v {
        font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em;
      }
      .live-cell .lat {
        font-family: var(--mono);
        font-size: 10.5px;
        color: rgba(255,255,255,.50);
      }

      /* Compact countdown shown inside the "Kickoff" KPI tile */
      .kpi.countdown-kpi .value {
        font-family: var(--mono);
        font-feature-settings: "tnum" 1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.04em;
        font-size: 22px;
      }
      .kpi.countdown-kpi .live-mark {
        display: inline-block;
        width: 7px; height: 7px;
        border-radius: 50%;
        background: var(--live);
        margin-right: 6px;
        vertical-align: middle;
        animation: pulse 1.6s ease-in-out infinite;
      }

      /* Broadcast-style news panels inside the live FIFA card */
      .news-panel {
        padding: 10px 14px 9px;
        border-right: 1px solid rgba(255,255,255,.08);
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        overflow: hidden;
        height: 72px;
      }
      .news-panel:last-child { border-right: 0; }
      .news-panel::before {
        content: "";
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 3px;
        background: var(--accent-color, var(--live));
      }
      .news-panel--fixtures { --accent-color: #ff3b30; }
      .news-panel--teams    { --accent-color: #f5b400; }
      .news-panel--facts    { --accent-color: #1d4ed8; }
      .news-panel--travel   { --accent-color: #00a650; }

      .news-label {
        font-family: var(--mono);
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
        display: flex; align-items: center; gap: 7px;
        flex: 0 0 auto;
      }
      .news-label::before {
        content: "";
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--accent-color, var(--live));
        box-shadow: 0 0 8px var(--accent-color, var(--live));
        animation: pulse 1.6s ease-in-out infinite;
      }

      .news-content {
        font-size: 11.5px;
        font-weight: 600;
        color: rgba(255,255,255,.96);
        line-height: 1.3;
        letter-spacing: -0.005em;
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
      }
      .news-content.popping {
        animation: news-pop .55s cubic-bezier(.2,.8,.2,1);
      }

      @keyframes news-pop {
        0%   { opacity: 0; transform: translateY(10px); }
        60%  { opacity: 1; transform: translateY(-2px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* ─────────── Marathon Clothing view ─────────── */
      .marathon-hero {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1c 60%, #2a2a2e 100%);
        color: #fff;
        border-radius: var(--radius);
        border: 1px solid #1f1f24;
        padding: 22px 26px;
        position: relative;
        overflow: hidden;
        box-shadow: var(--shadow-sm);
      }
      .marathon-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 220px at 0% 100%, rgba(0,166,80,.15), transparent 60%),
          radial-gradient(700px 220px at 100% 0%, rgba(245,180,0,.10), transparent 60%);
        pointer-events: none;
      }
      .marathon-hero .kicker {
        font-family: var(--mono);
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,.65);
        margin-bottom: 10px;
        position: relative;
      }
      .marathon-hero blockquote {
        margin: 0;
        font-size: clamp(20px, 2.6vw, 32px);
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.18;
        color: #fff;
        position: relative;
        padding-left: 16px;
        border-left: 3px solid var(--live);
      }
      .marathon-hero cite {
        display: block;
        margin-top: 12px;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: rgba(255,255,255,.78);
      }

      .marathon-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
        gap: 12px;
      }
      .marathon-col {
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-width: 0;
      }

      .nipsey-hero {
        position: relative;
        aspect-ratio: 16 / 9;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1c 60%, #2a2a2e 100%);
      }
      .nipsey-hero img {
        width: 100%; height: 100%;
        object-fit: cover;
        object-position: center;
        display: block;
      }
      .drops-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 10px;
      }
      .drop-tile {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: linear-gradient(135deg, #1a1a1c 0%, #3f3f46 100%);
        border: 1px solid var(--line);
        cursor: pointer;
        transition: transform .15s ease, box-shadow .2s ease;
      }
      .drop-tile:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
      .drop-tile img {
        width: 100%; height: 100%;
        object-fit: cover;
        display: block;
      }
      .drop-tile .meta {
        position: absolute;
        left: 8px; right: 8px; bottom: 6px;
        color: #fff;
        font-size: 10.5px;
        font-weight: 700;
        text-shadow: 0 1px 6px rgba(0,0,0,.7);
        z-index: 1;
      }
      .drop-tile::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, transparent 55%, rgba(0,0,0,.7) 100%);
        pointer-events: none;
      }

      .video-frame {
        position: relative;
        aspect-ratio: 16 / 9;
        background: #000;
        border-radius: var(--radius-sm);

      // KPI count-up animation (runs after render)
      function animateCountUps(root = document) {
        root.querySelectorAll(".kpi .value[data-count]").forEach((el) => {
          if (el.dataset.animated === "1") return;
          el.dataset.animated = "1";
          const target = parseFloat(el.dataset.count);
          const suffix = el.dataset.suffix || "";
          if (!isFinite(target)) return;
          const orig = el.textContent;
          const duration = 700;
          const start = performance.now();
          const decimals = (String(target).split(".")[1] || "").length;
          function tick(now) {
            const t = Math.min(1, (now - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const v = (target * eased).toFixed(decimals);
            el.textContent = (decimals > 0 ? v : Math.round(target * eased)) + suffix;
            if (t < 1) requestAnimationFrame(tick); else el.textContent = orig;
          }
          requestAnimationFrame(tick);
        });
      }

      // ───────────────── Live FIFA card ─────────────────
      // ───────────────── FIFA 2026 Countdown (KPI tile) ─────────────────
      // Opening match: Mexico City (Estadio Azteca), Jun 11, 2026 at 12:00 noon.
      // Mexico City sits on CST (UTC-6) year-round (DST abolished there in 2022),
      // so 12:00 CDMX = 18:00 UTC.
      const KICKOFF_UTC = Date.UTC(2026, 5, 11, 18, 0, 0);
      // Final: MetLife Stadium (NY/NJ), Jul 19, 2026 — 15:00 ET = 19:00 UTC.
      const FINAL_UTC   = Date.UTC(2026, 6, 19, 19, 0, 0);

      function pad2(n) { return String(n).padStart(2, "0"); }

      function updateCountdown() {
        const valEl = document.getElementById("cdValue");
        const subEl = document.getElementById("cdSub");
        if (!valEl) return;
        const now = Date.now();
        const toKick = KICKOFF_UTC - now;
        if (toKick > 0) {
          const d = Math.floor(toKick / 86400000);
          const h = Math.floor((toKick % 86400000) / 3600000);
          const m = Math.floor((toKick % 3600000) / 60000);
          const s = Math.floor((toKick % 60000) / 1000);
          valEl.innerHTML = `<span class="live-mark"></span>${d}d ${pad2(h)}:${pad2(m)}:${pad2(s)}`;
          if (subEl) subEl.textContent = "Kickoff · Jun 11, 2026 · CDMX";
          return;
        }
        const toFinal = FINAL_UTC - now;
        if (toFinal > 0) {
          const dayInto = Math.floor((now - KICKOFF_UTC) / 86400000) + 1;
          const dToFinal = Math.ceil(toFinal / 86400000);
          valEl.innerHTML = `<span class="live-mark"></span>Day ${dayInto}/39`;
          if (subEl) subEl.textContent = `Tournament live · ${dToFinal}d to Final`;
          return;
        }
        const daysSince = Math.floor((now - FINAL_UTC) / 86400000);
        valEl.textContent = "Concluded";
        if (subEl) subEl.textContent = `${daysSince}d since the Final · Jul 19`;
      }

      let marathonQuoteTimer = null;

        if (marathonQuoteTimer) { clearInterval(marathonQuoteTimer); marathonQuoteTimer = null; }
        const root = document.getElementById("marathonQuote");
        const text = document.getElementById("marathonQuoteText");
        if (!root || !text) return;
        let i = 0;
        const tick = () => {
          if (!document.getElementById("marathonQuoteText")) return;
          root.classList.remove("popping");
          void root.offsetWidth;
          text.textContent = NIPSEY_QUOTES[i % NIPSEY_QUOTES.length];
          root.classList.add("popping");
          i++;
        };
        tick();
        marathonQuoteTimer = setInterval(tick, 6000);
      }

      function renderMarathon() {
        const drops = MARATHON_DROPS.map(d => `

              <div class="card">

      // Pogba Academy hero strip. The 6 tiles map to real Pogba Academy
      // photos. Drop the source files at the local paths below (and
      // mirror them under public/assets/pogba/) — each <img> falls back
      // to a Picsum placeholder if the local file is missing. The strip
      // is a clean photo wall — no text overlay; the cards below already
      // label the offerings.
      const POGBA_TILES = [
        { local: "./assets/pogba/travel.jpg",         src: "https://picsum.photos/seed/pogba-travel/640/480",     alt: "Pogba Academy team boarding flight" },
        { local: "./assets/pogba/first-team.jpg",     src: "https://picsum.photos/seed/pogba-first-team/640/480", alt: "Pogba Academy first team in red kits" },
        { local: "./assets/pogba/elite-athletes.jpg", src: "https://picsum.photos/seed/pogba-elite/640/480",      alt: "Pogba brothers" },
        // Mentorship collage: Mathias' faces sit in the upper portion of the
        // image, so bias the focal point upward to keep them visible at every
        // breakpoint (the wider tile aspects would otherwise crop them out).
        { local: "./assets/pogba/mentorship.jpg",     src: "https://picsum.photos/seed/pogba-mentorship/640/480", alt: "Mathias Pogba mentoring youth players", objectPosition: "center 22%" },
        { local: "./assets/pogba/mundial.jpg",        src: "https://picsum.photos/seed/pogba-mundial/640/480",    alt: "Pogba Academy at Mundial de Clubes 2025" },
        { local: "./assets/pogba/mark.png",           src: "https://picsum.photos/seed/pogba-mark/640/480",       alt: "Pogba Academy mark" }
      ];

      function renderPogbaStrip() {
        return `
          <div class="pogba-strip">
            ${POGBA_TILES.map(t => {
              const style = t.objectPosition ? ` style="object-position: ${escapeHtml(t.objectPosition)}"` : "";
              return `
              <div class="pogba-tile">
                <img src="${t.local}" alt="${escapeHtml(t.alt)}" loading="lazy"${style}
                     onerror="this.onerror=null; this.src='${t.src}';" />
              </div>`;
            }).join("")}
          </div>`;
      }

      function renderYouth() {
        $("#youth").innerHTML = `
          ${renderPogbaStrip()}
      <div class="fill" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 360px)); gap:12px; justify-content:start; align-content:start;">
            ${simpleCard("World Cup Access", "Youth from different cultural backgrounds receive soccer learning, match-day context, and safe fan experiences.")}
            ${simpleCard("Futsal", "Compact tournaments for gyms, courts, mini-pitches, and community centers.")}
            ${simpleCard("Meet Elite Athletes", "Briefly connect with elite athletes in your city, live or virtually, for guidance.")}
            ${simpleCard("Mentor Network", "Coaches, translators, nonprofits, safety leads, and city partners operating together.")}

      function renderRecords() {
        $("#records").innerHTML = `
          ${renderKpis()}
          <div class="fill grid-3">
            ${simpleCard("Player Narratives", "Source-safe profiles, multilingual press lines, and sponsor-ready story pillars.")}

            ${simpleCard("Rights Review", "Controls before using player names, images, team marks, or tournament marks commercially.")}
          </div>`;
      }

      function renderTranslate() {
        $("#translate").innerHTML = `
          ${renderKpis()}
          <div class="fill">
            <div class="card">
              <div class="card-head"><h3>Language Access Matrix</h3><span class="meta">${countries.length} markets</span></div>
              <div class="card-body flush"><div class="table-wrap">
                <table>
                  <thead><tr><th>Market</th><th>Type</th><th>Languages</th><th>Coverage</th><th>Notes</th></tr></thead>
                  <tbody>
                    ${countries.map(c => `<tr><td><strong>${c[0]}</strong></td><td><span class="pill">${c[1]}</span></td><td>${c[2]}</td><td>Dashboard coverage</td><td>Human review for emergency copy</td></tr>`).join("")}
                  </tbody>

      function renderBracket() {
  $("#bracket").innerHTML = `
    ${renderKpis()}
    <div class="fill" style="overflow:auto">
      <div class="card">
        <div class="card-head"><h3>FIFA World Cup 2026 — Bracket</h3><span class="meta">Jun 11 – Jul 19, 2026 · 48 teams · 104 matches · 16 host cities</span></div>
        <div class="card-body">
          <p class="lede"><strong>Format:</strong> 12 groups of 4 → top 2 of each group + 8 best third-placed teams advance to the Round of 32 → R16 → QF → SF → 3rd-place match → Final. Hosts <strong>Canada, Mexico, USA</strong> qualify automatically.</p>
          <p class="lede" style="margin-top:6px"><strong>Opener:</strong> Mexico vs TBD — Estadio Azteca, Mexico City — Jun 11, 2026 · <strong>Final:</strong> MetLife Stadium, New York/New Jersey — Jul 19, 2026</p>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Group Stage — 12 Groups of 4</h4>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px;">
            ${[
              ["A","Mexico (host)"],["B","Canada (host)"],["C","TBD"],["D","USA (host)"],
              ["E","TBD"],["F","TBD"],["G","TBD"],["H","TBD"],
              ["I","TBD"],["J","TBD"],["K","TBD"],["L","TBD"]
            ].map(g => `<div style="border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface)"><strong>Group ${g[0]}</strong><ol style="margin:6px 0 0; padding-left:18px; font-size:12px; color:var(--ink-2)"><li>${g[1]}</li><li>TBD</li><li>TBD</li><li>TBD</li></ol></div>`).join("")}
          </div>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Knockout Stage</h4>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:10px;">
            ${[
              ["Round of 32","32 teams · first knockout"],
              ["Round of 16","16 teams"],
              ["Quarter-finals","8 teams"],
              ["Semi-finals","Jul 14 Dallas · Jul 15 Atlanta"],
              ["3rd-place","Jul 18 · Miami"],
              ["Final","Jul 19 · MetLife (NY/NJ)"]
            ].map(r => `<div style="border:1px solid var(--line); border-radius:10px; padding:8px 10px; background:var(--surface)"><strong>${r[0]}</strong><div style="font-size:11.5px; color:var(--ink-3); margin-top:4px">${r[1]}</div></div>`).join("")}
          </div>
          <h4 style="margin:18px 0 8px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)">Host Cities (16)</h4>
          <p class="lede"><strong>Mexico:</strong> Mexico City (Estadio Azteca), Guadalajara, Monterrey · <strong>Canada:</strong> Toronto, Vancouver · <strong>USA:</strong> Atlanta, Boston, Dallas, Houston, Kansas City, Los Angeles, Miami, New York/New Jersey, Philadelphia, San Francisco Bay Area, Seattle</p>
        </div>
      </div>
    </div>`;      }

      function simpleCard(title, copy) {
        return `
          <div class="card">
            <div class="card-head"><h3>${title}</h3></div>
            <div class="card-body"><p class="lede">${copy}</p></div>
          </div>`;
      }

      // ───────────────── Active view ─────────────────
      function renderActive() {
        renderNav();
        const meta = views.find(v => v[0] === state.view);
        $("#viewTitle").textContent = meta ? meta[1] : "Overview";
        const crumbs = {
          overview: "Real-time host-city intelligence · FIFA World Cup 2026",
          live: "Verified FIFA · CDC · partner endpoints · streaming when reachable",
          map: "All 16 host venues · click a card to focus that city on the overview map",
          stadiums: "Verified venue register · 16 host stadiums",
          grants: "Open grants & funding pathways · live status",
          business: "Local-market activation strategy",
          transport: "Match-day mobility advisories",
          safety: "Stewardship, health, and fan-flow",
          marathon: "The Marathon Continues · drops, music, and the Crenshaw legacy",
          youth: "Pogba Academy · World Cup access, futsal, athlete meet-ups, mentorship",
          records: "Narratives, campaigns, and rights",
          translate: "Multilingual coverage matrix",
          bracket: "Tournament framework"
        };
        $("#viewCrumb").textContent = crumbs[state.view] || "";

        $$(".section").forEach(s => s.classList.toggle("active", s.id === state.view));

        const r = {
          overview: renderOverview, map: renderMapSection,
          stadiums: renderStadiums, grants: renderGrants, business: renderBusiness,
          transport: renderTransport, safety: renderSafety, marathon: renderMarathon,
          youth: renderYouth, records: renderRecords, translate: renderTranslate,
          bracket: renderBracket
        }[state.view];
        if (r) r();

        const chip = $("#liveChip");
        const isLive = state.live === "connected";
        chip.classList.toggle("off", !isLive);
        $("#liveLabel").textContent = isLive ? "Live · streaming" : `Live · ${state.live}`;
        $("#footPing").classList.toggle("live", isLive);

        requestAnimationFrame(() => {
          initVisibleMaps();
          animateCountUps();
          updateCountdown();
          startNewsRotation();
          startMarathonQuoteRotator();
        });
      }

      function initVisibleMaps() {
        ["hostMap_overview", "hostMap_detail"].forEach((id) => {
          const el = document.getElementById(id);
          if (!el || !window.L) return;
          if (maps[id]) {
            try { maps[id].remove(); } catch {}
            delete maps[id];
            delete markerLayers[id];
          }
          const map = L.map(id, { zoomControl: true, scrollWheelZoom: false, attributionControl: false }).setView([39.5, -98], 3);
          L.tileLayer("https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png", {
            attribution: "© OpenStreetMap · © CARTO",
            maxZoom: 18,
            subdomains: "abcd"
          }).addTo(map);
          L.tileLayer("https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png", {
            maxZoom: 18, subdomains: "abcd"
          }).addTo(map);
          L.control.attribution({ position: "bottomright", prefix: false })
            .addAttribution("© OpenStreetMap · © CARTO").addTo(map);
          maps[id] = map;
          markerLayers[id] = L.layerGroup().addTo(map);
          stadiums.forEach((s) => {
            const selected = s.city === state.city;
            const marker = L.marker([s.lat, s.lng], {
              icon: L.divIcon({
                className: "",
                html: `<span class="host-marker ${selected ? "active" : ""}"></span>`,
                iconSize: selected ? [16, 16] : [12, 12],
                iconAnchor: selected ? [8, 8] : [6, 6]
              })
            }).addTo(markerLayers[id]);
            marker.bindTooltip(`${s.city} · ${s.venue}`, { direction: "top", offset: [0, -4] });
            marker.on("click", () => {
              state.city = s.city;
              renderActive();
            });
          });
          setTimeout(() => map.invalidateSize(), 30);
        });
      }

      // ───────────────── Live data ─────────────────
      async function refreshLive() {
        state.live = "checking";
        state.grantLive = "checking";
        renderActive();
        toast("Querying verified live sources…");
        try {
          const [live, grant] = await Promise.allSettled([
            fetch("/api/live-feeds"),
            fetch("/api/grant-feeds")
          ]);
          if (live.status === "fulfilled" && live.value.ok) {
            const payload = await live.value.json();
            state.live = "connected";
            state.liveSources = payload.sources || [];
            state.liveItems = payload.items || [];
            state.generatedAt = payload.generatedAt || null;
          } else {
            state.live = "unavailable";
          }
          if (grant.status === "fulfilled" && grant.value.ok) {
            const payload = await grant.value.json();
            state.grantLive = "connected";
            state.grantSources = payload.sources || [];
            state.grantItems = payload.items || [];
            state.grantGeneratedAt = payload.generatedAt || null;
          } else {
            state.grantLive = "unavailable";
          }
          toast(state.live === "connected" ? "Live sources synced." : "Live API unreachable — running in static mode.");
        } catch {
          state.live = "unavailable";
          state.grantLive = "unavailable";
          toast("Live API unreachable — running in static mode.");
        }
        renderActive();
      }

      function toast(msg) {
        const t = $("#toast");
        t.textContent = msg;
        t.classList.add("show");
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.remove("show"), 2400);
      }

      function openModal(title, body) {
        $("#modalTitle").textContent = title;
        $("#modalBody").innerHTML = body;
        $("#modal").classList.add("open");
      }

      // ───────────────── Routing (URL hash) ─────────────────
      // Persists the active view in location.hash so refresh and
      // shareable links land on the right tab. Browser back/forward
      // walk the history stack the user actually built.
      const VIEW_IDS = new Set(views.map(v => v[0]));

      function viewFromHash() {
        const v = (location.hash || "").replace(/^#/, "");
        return VIEW_IDS.has(v) ? v : null;
      }

      function navigate(view) {
        if (!VIEW_IDS.has(view) || view === state.view) {
          state.view = view;
          renderActive();
          return;
        }
        state.view = view;
        const hash = "#" + view;
        if (location.hash !== hash) {
          history.pushState(null, "", hash);
        }
        renderActive();
      }

      window.addEventListener("hashchange", () => {
        const v = viewFromHash() || "overview";
        if (state.view !== v) {
          state.view = v;
          renderActive();
        }
      });

      // ───────────────── Events ─────────────────
      document.addEventListener("click", (e) => {
        const navBtn = e.target.closest("[data-view]");
        if (navBtn) {
          navigate(navBtn.dataset.view);
          return;
        }
        const sortHeader = e.target.closest("th[data-sort]");
        if (sortHeader) {
          const k = sortHeader.dataset.sort;
          if (state.stadiumSort.key === k) {
            state.stadiumSort.dir = state.stadiumSort.dir === "asc" ? "desc" : "asc";
          } else {
            state.stadiumSort = { key: k, dir: k === "cap" ? "desc" : "asc" };
          }
          renderStadiums();
          return;
        }
        const focusRow = e.target.closest("[data-focus-city]");
        if (focusRow) {
          const city = focusRow.dataset.focusCity;
          if (stadiums.some(s => s.city === city)) {
            state.city = city;
            navigate("map");
            toast(`Focused ${city}`);
          }
          return;
        }
        const openCity = e.target.closest("[data-open-city]");
        if (openCity) {
          const s = stadiums.find(x => x.city === openCity.dataset.openCity);
          if (s) {
            openModal(s.city, `
              <div class="list">
                ${listRow("Venue", `<strong>${s.venue}</strong>`)}
                ${listRow("Country", s.country)}
                ${listRow("Capacity", s.cap.toLocaleString())}
                ${listRow("Coordinates", `<span style="font-family:var(--mono)">${s.lat.toFixed(3)}, ${s.lng.toFixed(3)}</span>`)}
                ${listRow("Operational focus", "Transit · safety · business · language access")}
              </div>`);
          }
          return;
        }
        if (e.target.id === "grantRefresh") refreshLive();
        if (e.target.id === "modal") $("#modal").classList.remove("open");
      });

      document.addEventListener("keydown", (e) => {
        if (e.target.matches("input, select, textarea")) return;
        const map = { "1":"overview","2":"map","3":"stadiums","4":"transport","5":"safety","6":"youth","7":"bracket","8":"marathon" };
        if (map[e.key]) { navigate(map[e.key]); }
        if (e.key === "Escape") $("#modal").classList.remove("open");
      });

      $("#refreshBtn").addEventListener("click", refreshLive);
      // Drive Google Translate via the topbar language picker. The widget
      // loads async, so poll a short while for its select to be present.
      function setPageLanguage(lang) {
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        let attempts = 0;
        const trySet = () => {
          const goog = document.querySelector(".goog-te-combo");
          if (goog) {
            goog.value = lang;
            goog.dispatchEvent(new Event("change"));
            return;
          }
          if (++attempts < 30) setTimeout(trySet, 200);
        };
        trySet();
      }

      $("#languageSelect").addEventListener("change", (e) => {
        const lang = e.target.value;
        setPageLanguage(lang);
        toast(lang === "en" ? "Language: English" : `Translating to ${lang.toUpperCase()}…`);
      });
      $("#closeModal").addEventListener("click", () => $("#modal").classList.remove("open"));
      $("#menuBtn")?.addEventListener("click", () => {
        document.querySelector(".nav").scrollIntoView({ behavior: "smooth" });
      });

      // Init — restore the active view from #hash so refreshes,
      // shareable links, and back/forward all land where the user expects.
      const initialView = viewFromHash();
      if (initialView) state.view = initialView;
      renderActive();
      refreshLive();
      setInterval(refreshLive, 5 * 60 * 1000);
      // Tick the FIFA 2026 countdown every second
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
